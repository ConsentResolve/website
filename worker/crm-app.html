  .achip .ax{cursor:pointer;color:var(--tx-3);font-weight:700}
  .achip .ax:hover{color:var(--bad)}
  .rc-foot{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line)}
  .rc-icon{border:0;background:none;color:var(--tx-3);cursor:pointer;font-size:15px;width:32px;height:32px;border-radius:var(--r-1);display:grid;place-items:center}
  .rc-icon:hover{background:var(--hover);color:var(--tx-1)}
  .rc-trash{margin-left:auto}

  /* running lead-age clock + owner avatar in the list */
  .row .l1{gap:7px}
  /* speed-to-lead urgency chip: escalates as a lead waits for a human reply */
  .row .clk{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12.5px;font-weight:800;white-space:nowrap;padding:3px 9px;border-radius:var(--r-full);letter-spacing:.02em;line-height:1.15}
  .clk.calm{background:var(--surface-3);color:var(--tx-3)}                                   /* handled / not awaiting reply */
  .clk.fresh{background:var(--good-soft);color:var(--good)}                                  /* < 5 min — on time */
  .clk.warm{background:var(--src-apollo-soft);color:var(--src-apollo)}                       /* 5–15 min — getting late */
  .clk.hot{background:var(--bad-soft);color:var(--bad);animation:clkpulse 1.3s ease-in-out infinite}  /* 15 min–24 h — respond now */
  .clk.stale{background:var(--bad-soft);color:var(--bad);opacity:.8}                                   /* > 24 h — missed, no strobe */
  /* Gmail-style arrival date — plain, no pill, easy-to-read black bold. Used for every row
     that isn't a fresh lead still awaiting a fast reply. */
  .clk.date{background:none;padding:3px 0;color:var(--tx-1);font-family:inherit;font-weight:700;letter-spacing:0;font-size:12.5px}
  /* Static conversation date+time — black bold, easy to read, no pill, no countdown. */
  .row .rdate{margin-left:auto;color:var(--tx-1);font-weight:700;font-size:12.5px;white-space:nowrap;flex:0 0 auto}
  @keyframes clkpulse{0%{box-shadow:0 0 0 0 var(--bad-soft)}70%{box-shadow:0 0 0 6px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
  /* Activity-tab note composer */
  .notecomp{margin-bottom:12px}
  .notebox{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);color:var(--tx-1);font:inherit;font-size:13px;padding:9px 11px;resize:vertical;min-height:44px}
  .notebox:focus{outline:none;border-color:var(--accent)}
  .noterow{display:flex;justify-content:flex-end;margin-top:6px}
  .notebtn{border:1px solid var(--line);background:var(--surface-2);color:var(--tx-1);font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:8px;cursor:pointer}
  .notebtn:hover{background:var(--surface-3)}
  .notebtn:disabled{opacity:.6;cursor:default}
  .row .oav-sm{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:800;flex:0 0 auto}

  /* Status panel — light card, reworked for legibility */
  .card.status{padding:15px}
  .card.status .shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .card.status h4{margin:0}
  /* automation switch */
  .autoswitch{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-full);padding:2px}
  .autoswitch .seg{border:0;background:none;color:var(--tx-3);font:inherit;font-size:11px;font-weight:800;padding:4px 11px;border-radius:var(--r-full);cursor:pointer;letter-spacing:.02em}
  .autoswitch .seg.on.onauto{background:var(--accent);color:var(--on-accent)}
  .autoswitch .seg.on.onman{background:var(--bad);color:#fff}
  .autobadge{font-size:11px;font-weight:800;padding:5px 11px;border-radius:var(--r-full)}
  .autobadge.done{background:var(--good-soft);color:var(--good)}
  .autobadge.off{background:var(--bad-soft);color:var(--bad)}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:15px}
  .scell{display:flex;flex-direction:column;gap:3px;min-width:0}
  .scell .sl{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3)}
  .scell .sv{font-size:var(--t-14);font-weight:700;color:var(--tx-1)}
  .scell .sv.warn{color:var(--warn)} .scell .sv.bad{color:var(--bad)} .scell .sv.mut{color:var(--tx-3);font-weight:600}
  /* automation note as a hover tooltip */
  .autowrap{position:relative;display:inline-flex}
  .autowrap .tip{position:absolute;top:calc(100% + 8px);right:0;width:232px;background:var(--surface-1);border:1px solid var(--line-2);border-radius:var(--r-2);padding:9px 11px;font-size:var(--t-12);line-height:1.5;color:var(--tx-2);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(-3px);transition:opacity var(--motion),transform var(--motion);z-index:20}
  .autowrap .tip b{color:var(--tx-1);font-weight:700}
  .autowrap:hover .tip{opacity:1;transform:none}
  /* workflow tracker block (top of the status box) */
  .seqwrap{margin-bottom:15px}
  /* our acquisition cost for this lead (small, animated) */
  .acqcost{margin-top:2px}
  .acqcost .lab{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3);margin-bottom:2px}
  .acqcost .amt{font-family:var(--font-mono);font-size:var(--t-16);font-weight:800;color:var(--src-site);line-height:1.15}
  .acqcost .ch{font-size:11px;color:var(--tx-2);margin-top:1px}
  .acqcost.none{font-size:var(--t-12);color:var(--tx-3);font-weight:600;margin-top:4px}

  .intel{border-left:1px solid var(--line);background:var(--surface-1);overflow-y:auto;padding:16px 15px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-3);padding:13px}
  .card h4{margin:0 0 9px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-3)}
  .fit{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 9px;border-radius:var(--r-full)}
  .fit.hot{background:var(--bad-soft);color:var(--bad)} .fit.warm{background:var(--warn-soft);color:var(--warn)} .fit.cold,.fit.unknown{background:var(--surface-3);color:var(--tx-3)}
  .clist{display:flex;flex-direction:column;gap:8px}
  .crow{display:flex;align-items:center;gap:8px;font-size:var(--t-13)}
  .crow .k{color:var(--tx-3);width:52px;text-transform:capitalize;font-weight:600}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--surface-3);border-radius:var(--r-2);padding:9px 11px}
  .tile .v{font-size:var(--t-16);font-weight:800;font-family:var(--font-mono)}
  .tile .k{font-size:10px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .pv-list{display:flex;flex-direction:column;gap:5px;font-size:var(--t-12);font-family:var(--font-mono);color:var(--tx-2)}
  .cost{font-size:var(--t-13);font-weight:700;color:var(--src-site)}
  .dealcard b{font-size:var(--t-16);font-family:var(--font-mono)}
  .prob{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px}
  .prob i{display:block;height:100%;background:var(--accent)}

  /* ===== modern chrome: SVG icon system, focus rings, elevation ===== */
  svg{flex:0 0 auto}
  .rail a svg{width:21px;height:21px}
  .tab .ti{display:inline-flex}
  .tab .ti svg{width:16px;height:16px}
  .ract svg{width:13px;height:13px}
  .rc-icon svg{width:17px;height:17px}
  .rbtn-reply svg{width:15px;height:15px}
  .search svg{width:15px;height:15px;color:var(--tx-3);flex:0 0 auto}
  .searchin{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--tx-1);font-size:var(--t-13);font-family:inherit}
  .searchin::placeholder{color:var(--tx-3)}
  .searchin::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  .pipe svg,.pipe-total svg{width:15px;height:15px;color:var(--src-site);vertical-align:-2px;margin-right:1px}
  /* keyboard focus — visible only for keyboard users, never on mouse */
  :focus{outline:none}
  a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible,.row:focus-visible,.lrow:focus-visible,.seqitem:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-1)}
  input:focus-visible{outline-offset:0}
  /* the rich-text editor shows focus by being the active surface — no clipped outline box */
  .rte:focus,.rte:focus-visible{outline:none}
  /* elevation: lift the top bar and primary surfaces off the canvas */
  .top{box-shadow:var(--shadow-sm);position:relative;z-index:10}
  .search:focus-within{border-color:var(--accent);background:var(--surface-1)}
  /* refined rail active state — pill + accent icon + left tick */
  .rail a{transition:background var(--motion),color var(--motion)}
  .rail a.on::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent)}
  /* subtle, consistent elevation on dashboard cards — depth without puffiness */
  .kpi,.itile,.icard,.pcard,.stepnode{box-shadow:var(--shadow-sm)}
  .pcard:hover{box-shadow:var(--shadow-card)}

  /* ===== Nurture view — dormant long-term follow-up pool ===== */
  .nurtureview{grid-column:2;grid-row:1;min-height:0;min-width:0;background:var(--surface-0);overflow:auto;padding:22px 26px}
  .nurtureview[hidden]{display:none}
  .nu-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .nu-head h2{margin:0;font-family:var(--font-display);font-size:var(--t-24);font-weight:800}
  .nu-head .sub{font-size:var(--t-13);color:var(--tx-2);max-width:680px;line-height:1.5}
  /* how-it-works explainer */
  .nu-how{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-3);padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
  .nu-how h4{margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-2)}
  .nu-how ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .nu-how li{font-size:var(--t-12);line-height:1.5;color:var(--tx-2);position:relative;padding-left:30px}
  .nu-how li b{color:var(--tx-1);display:block;margin-bottom:3px;font-size:var(--t-13)}
  .nu-how li .stp{position:absolute;top:0;left:0;width:21px;height:21px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--font-mono)}
  .nu-how li::after{content:"→";position:absolute;right:-11px;top:0;color:var(--tx-3);font-weight:800}
  .nu-how li:last-child::after{display:none}
  @media(max-width:1000px){.nu-how ol{grid-template-columns:1fr 1fr}.nu-how li::after{display:none}}
  /* re-engaging band */
  .nu-band{margin-bottom:24px}
  .nu-band-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-2)}
  .nu-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:var(--r-full);padding:3px 9px;letter-spacing:.04em}
  .nu-live .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:nupulse 1.6s ease-in-out infinite}
  /* Real-time Site Spy widgets */
  .lv-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden}
  .lv-row{display:grid;grid-template-columns:14px 1.4fr 1.6fr auto;gap:12px;align-items:center;background:var(--surface-1);padding:11px 14px;font-size:var(--t-13)}
  .lv-row.intent{background:var(--good-soft)}
  .lv-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
  .lv-who{display:flex;flex-direction:column;gap:1px;justify-content:center;overflow:hidden}
  .lv-who>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-loc{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
  .lv-page{color:var(--tx-2);font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-meta{color:var(--tx-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .bell-toggle{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:6px}
  .bell-toggle:hover{background:var(--hover)}
  .attn-list{display:flex;flex-direction:column;gap:8px}
  .attn-item{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:var(--r-2);font-size:var(--t-13);line-height:1.45;border:1px solid var(--line)}
  .attn-item.warn{background:var(--warn-soft,#fff7ed);border-color:var(--warn,#c2820a)}
  .attn-item.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  .attn-ic{flex:0 0 auto;font-weight:800}
  .attn-item.warn .attn-ic{color:var(--warn,#c2820a)} .attn-item.good .attn-ic{color:var(--good)}
  .tp-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:var(--t-13)}
  .tp-row:first-of-type{border-top:0}
  .tp-path{color:var(--tx-2);font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tp-n{font-weight:800;font-variant-numeric:tabular-nums}
  @media(max-width:1080px){.lv-row{grid-template-columns:12px 1fr auto;gap:8px}.lv-page{display:none}}
  .lv-row.clickable{cursor:pointer}.lv-row.clickable:hover{background:var(--surface-2)}
  /* consent / visited chips */
  .vchip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
  .cs-yes{background:rgba(0,185,133,.16);color:var(--good,#00a877)}
  .cs-no{background:rgba(220,80,80,.16);color:var(--bad,#d64545)}
  .cs-unk{background:rgba(148,163,184,.18);color:var(--tx-3)}
  .vv-yes{background:rgba(0,185,133,.14);color:var(--good,#00a877)}
  .vv-no{background:rgba(148,163,184,.14);color:var(--tx-3)}
  /* identified-by-company groups */
  .spy-co{border:1px solid var(--line);border-radius:var(--r-2);margin-bottom:8px;background:var(--surface-1);overflow:hidden}
  .spy-co>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700}
  .spy-co>summary::-webkit-details-marker{display:none}
  .spy-co>summary::before{content:'▸';color:var(--tx-3);transition:transform .15s}
  .spy-co[open]>summary::before{transform:rotate(90deg)}
  .spy-co-nm{font-weight:800}.spy-co-n{font-size:12px;color:var(--tx-3);font-weight:600}
  .spy-co-tbl{margin:0}.spy-co-tbl thead th{background:var(--surface-2)}
  /* visitor 360 detail card */
  .vd-card{border:1px solid var(--accent);border-radius:var(--r-3);background:var(--surface-1);padding:14px 16px;margin:8px 0 14px;box-shadow:var(--shadow-sm)}
  .vd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .vd-nm{font-size:16px;font-weight:800}.vd-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .vd-x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--tx-3);cursor:pointer}
  .vd-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
  @media(max-width:820px){.vd-grid{grid-template-columns:1fr}}
  .vd-col h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-3)}
  .vd-c{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px;font-size:10px;margin-left:4px}
  .vd-kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .vd-kv span{color:var(--tx-3)}
  .vd-notes{margin-top:8px;font-size:12.5px;color:var(--tx-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
  .vd-list{display:flex;flex-direction:column;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .vd-row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .vd-row:last-child{border-bottom:0}.vd-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vd-at{color:var(--tx-3);white-space:nowrap;font-size:11px}
  @keyframes nupulse{0%,100%{opacity:1}50%{opacity:.3}}
  .nu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .nu-card{background:var(--surface-1);border:1px solid var(--accent);border-radius:var(--r-3);padding:15px 16px;box-shadow:var(--shadow-sm)}
  .nu-c-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .nu-c-av{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
  .nu-c-id{min-width:0;flex:1}
  .nu-c-name{font-weight:800;font-size:var(--t-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nu-c-co{font-size:var(--t-12);color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nu-c-chs{display:flex;gap:5px;flex:0 0 auto;color:var(--tx-3)}
  .nu-c-chs svg{width:15px;height:15px}
  .nu-signal{display:flex;align-items:flex-start;gap:8px;background:var(--good-soft);border:1px solid rgba(15,157,107,.28);border-radius:var(--r-2);padding:9px 11px;font-size:var(--t-12);line-height:1.4;color:var(--tx-1);margin-bottom:11px}
  .nu-signal svg{width:15px;height:15px;color:var(--good);margin-top:1px}
  .nu-signal time{display:block;color:var(--tx-3);font-family:var(--font-mono);font-size:10.5px;margin-top:3px}
  .nu-seq{display:flex;align-items:center;gap:11px}
  .nu-seq-bar{flex:1;min-width:0}
  .nu-seq-steps{display:flex;gap:4px;margin-bottom:6px}
  .nu-seq-steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-3)}
  .nu-seq-steps i.on{background:var(--accent)}
  .nu-seq-txt{font-size:11px;color:var(--tx-2);line-height:1.4}
  .nu-seq-txt b{color:var(--tx-1)}
  .nu-open{border:1px solid var(--line-2);background:var(--surface-1);color:var(--accent);border-radius:var(--r-1);font:inherit;font-size:11px;font-weight:700;padding:7px 12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .nu-open:hover{border-color:var(--accent);background:var(--accent-soft)}
  /* pool table */
  .nu-pool-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;flex-wrap:wrap}
  .nu-pool-h h4{margin:0;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-2)}
  .nu-cco{font-size:11px;color:var(--tx-3)}
  .nu-ch-cell{display:flex;gap:5px;color:var(--tx-3)}
  .nu-ch-cell svg{width:14px;height:14px}
  .nu-act{font-family:var(--font-mono);font-size:11px;color:var(--tx-3);white-space:nowrap}
  .nu-dd{font-family:var(--font-mono);color:var(--tx-3);font-size:11px;white-space:nowrap}
  .nustat{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-full)}
  .nustat.dormant{background:var(--surface-3);color:var(--tx-3)}
  .nustat.recovered{background:var(--good-soft);color:var(--good)}

  /* ===== Profile menu (top-left) ===== */
  .profile{position:relative;flex:0 0 auto;margin-left:auto}
  .pfbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-full);padding:4px 10px 4px 4px;cursor:pointer;font:inherit}
  .pfbtn:hover{border-color:var(--line-2)}
  .pfav{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto;overflow:hidden}
  .pfav img{width:100%;height:100%;object-fit:cover}
  .pfname{font-size:var(--t-13);font-weight:700;color:var(--tx-1);white-space:nowrap}
  .pfcar{width:14px;height:14px;color:var(--tx-3)}
  .pfmenu{position:absolute;top:calc(100% + 8px);right:0;width:264px;background:var(--surface-1);border:1px solid var(--line-2);border-radius:var(--r-3);box-shadow:var(--shadow);padding:8px;z-index:50}
  .pfmenu[hidden]{display:none}
  .pf-head{display:flex;align-items:center;gap:11px;padding:8px 8px 12px}
  .pfav.lg{width:40px;height:40px;font-size:14px}
  .pf-id{min-width:0}
  .pf-id b{display:block;font-size:var(--t-14);font-weight:700;color:var(--tx-1)}
  .pf-id span{display:block;font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-upload{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line-2);background:var(--surface-1);color:var(--tx-1);border-radius:var(--r-2);padding:8px 11px;font:inherit;font-size:var(--t-13);font-weight:600;cursor:pointer}
  .pf-upload svg{width:15px;height:15px;color:var(--tx-2)}
  .pf-upload:hover{border-color:var(--accent);color:var(--accent)}
  .pf-upload:hover svg{color:var(--accent)}
  .pf-sep{height:1px;background:var(--line);margin:8px 0}
  .pf-lbl{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3);padding:0 8px 7px}
  .pfmenu .toggle{width:100%;justify-content:stretch}
  .pfmenu .toggle button{flex:1}
  .pf-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--r-2);font-size:var(--t-13);font-weight:600;color:var(--tx-1);cursor:pointer;text-decoration:none}
  .pf-item svg{width:16px;height:16px;color:var(--tx-3)}
  .pf-item:hover{background:var(--hover)}
  .pf-item.danger{color:var(--bad)} .pf-item.danger svg{color:var(--bad)}

  /* ===== Site Spy — engagement pills + live "viewing" state ===== */
  .se-pills{display:flex;flex-wrap:wrap;gap:5px}
  .se-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-full);white-space:nowrap;border:1px solid transparent}
  .se-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .se-pill.seq{background:var(--accent-soft);color:var(--accent)}
  .se-pill.conv{background:var(--src-chatwoot-soft);color:var(--src-chatwoot)}
  .se-pill.auto{background:var(--good-soft);color:var(--good)}
  .se-pill.paused{background:var(--bad-soft);color:var(--bad)}
  .se-pill.nurture{background:var(--src-site-soft);color:var(--src-site)}
  .se-pill.supp{background:var(--bad-soft);color:var(--bad)}
  .se-pill.newp{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .sp-view{font-weight:700;color:var(--accent);font-family:var(--font-mono);font-size:var(--t-13)}
  .sp-last{color:var(--tx-2);font-family:var(--font-mono);font-size:var(--t-13)}
  .sp-page{font-family:var(--font-mono);font-size:var(--t-13);color:var(--tx-1)}
  .sp-trail{font-family:var(--font-mono);font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .sp-time{font-family:var(--font-mono);font-size:11px;color:var(--tx-3)}
  .sp-livedot{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--good);letter-spacing:.03em;flex:0 0 auto}
  .sp-livedot .d{width:7px;height:7px;border-radius:50%;background:var(--good);animation:nupulse 1.6s ease-in-out infinite}
  .nu-signal.now{background:var(--accent-soft);border-color:rgba(0,185,133,.32)}
  .sp-eye{display:inline-flex;flex:0 0 auto}
  .sp-eye svg{width:15px;height:15px;color:var(--accent);margin-top:1px}
  .sp-cardfoot{margin-top:11px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}

  /* Auto-switch approval modal */
  .am-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,22,40,.5);backdrop-filter:blur(2px);padding:20px}
  .am-overlay.show{display:flex}
  .am-card{width:min(460px,94vw);max-height:88vh;overflow:auto;background:var(--surface-1);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 64px rgba(10,22,40,.4)}
  .am-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 6px}
  .am-head h3{margin:0;font-size:17px;font-weight:800;color:var(--tx-1)}
  .am-head .am-x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--tx-3);cursor:pointer}
  .am-lead{padding:0 20px 4px;font-size:13px;color:var(--tx-2)}
  .am-body{padding:8px 20px 4px}
  .am-ok{font-size:12.5px;font-weight:700;color:var(--good);background:var(--good-soft);padding:7px 11px;border-radius:8px;margin-bottom:12px}
  .am-warn{font-size:12.5px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:7px 11px;border-radius:8px;margin-bottom:12px}
  .am-seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .am-seq li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line)}
  .am-seq li:last-child{border-bottom:0}
  .am-when{flex:0 0 74px;font-family:var(--font-mono);font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
  .am-what{font-size:13.5px;color:var(--tx-1);font-weight:600}
  .am-sub{margin-top:10px;font-size:12px;color:var(--tx-3)}
  .am-stop{margin-top:12px;font-size:12.5px;color:var(--tx-2);background:var(--surface-2);border-radius:8px;padding:9px 11px}
  .am-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 18px}
  .am-btn{border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
  .am-btn.cancel{background:transparent;color:var(--tx-2)}
  .am-btn.cancel:hover{background:var(--surface-2)}
  .am-btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
  .am-btn.go:hover{filter:brightness(.96)}
  .am-btn.go:disabled{opacity:.5;cursor:not-allowed}

  /* Account settings + Notifications panels (reuse .am-overlay/.am-card) */
  .acc-form{display:flex;flex-direction:column;gap:14px;padding-top:6px}
  .acc-av{display:flex;align-items:center;gap:14px}
  .acc-av .av{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:22px;font-weight:800;overflow:hidden;flex:0 0 auto}
  .acc-av .av img{width:100%;height:100%;object-fit:cover}
  .acc-av .btns{display:flex;gap:8px;flex-wrap:wrap}
  .acc-field{display:flex;flex-direction:column;gap:5px}
  .acc-field label{font-size:12px;font-weight:700;color:var(--tx-2)}
  .acc-in,.acc-ta{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-1);color:var(--tx-1);font-size:13.5px;box-sizing:border-box;font-family:inherit}
  .acc-in:focus,.acc-ta:focus{outline:none;border-color:var(--accent)}
  .acc-in[readonly]{background:var(--surface-2);color:var(--tx-2);cursor:not-allowed}
  .acc-ta{min-height:84px;resize:vertical;line-height:1.5}
  .acc-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .acc-sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);margin:4px 0 -4px}
  .acc-soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acc-hint{font-size:11.5px;color:var(--tx-3)}
  .acc-note{font-size:12.5px;font-weight:800;color:var(--good);margin-right:auto;align-self:center}
  @media(max-width:520px){ .acc-row2,.acc-soc{grid-template-columns:1fr} }

  .ntf-personas{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
  .ntf-persona{flex:1;min-width:130px;border:1px solid var(--line);border-radius:11px;background:var(--surface-1);padding:10px 12px;cursor:pointer;text-align:left}
  .ntf-persona:hover{border-color:var(--accent)}
  .ntf-persona.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .ntf-persona b{display:block;font-size:13px;font-weight:800;color:var(--tx-1)}
  .ntf-persona span{font-size:11px;color:var(--tx-3)}
  .ntf-grouphd{display:grid;grid-template-columns:1fr 54px 54px;gap:8px;align-items:center;padding:6px 0 2px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-3)}
  .ntf-grouphd span:not(:first-child){text-align:center}
  .ntf-cat{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px}
  .ntf-row{display:grid;grid-template-columns:1fr 54px 54px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .ntf-row .lab b{display:block;font-size:13px;font-weight:700;color:var(--tx-1)}
  .ntf-row .lab span{font-size:11.5px;color:var(--tx-3)}
  .ntf-row .cell{display:grid;place-items:center}
  .ntf-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

  /* Reminder picker + Reminders view */
  .rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
  .rm-quick{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--tx-1);cursor:pointer;text-align:left}
  .rm-quick:hover{border-color:var(--accent);background:var(--accent-soft)}
  .rm-quick b{display:block;font-size:10.5px;font-weight:600;color:var(--tx-3);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
  .rm-note{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);color:var(--tx-1);font-size:13px;margin-bottom:12px;box-sizing:border-box}
  .rm-note:focus{outline:none;border-color:var(--accent)}
  .rm-note-txt{font-size:12px;color:var(--tx-2);margin-top:3px}
  .rm-custom{display:flex;gap:8px;align-items:center}
  .rm-custom input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);color:var(--tx-1);font-size:13px}
  .rm-hdr-btn{align-self:flex-end;display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-full);padding:5px 12px;cursor:pointer;font-size:var(--t-12);font-weight:700;color:var(--tx-1);white-space:nowrap}
  .rm-hdr-btn:hover{border-color:var(--accent);color:var(--accent)}
  .row .rmchip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:var(--r-full);background:var(--surface-3);color:var(--tx-2);margin-left:6px;font-family:var(--font-mono)}
  .row .rmchip.due{background:var(--bad-soft);color:var(--bad)}
  .rmview{padding:20px 24px;overflow:auto;height:100%}
  .rmview h2{margin:0 0 3px;font-size:20px;font-weight:800;color:var(--tx-1)}
  .rmview .sub{color:var(--tx-3);font-size:13px;margin-bottom:14px}
  .rm-sec{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin:20px 0 9px}
  .rm-sec.overdue{color:var(--bad)}
  .rm-item{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-1)}
  .rm-item.due{border-color:var(--bad);background:var(--bad-soft)}
  .rm-when{flex:0 0 150px;font-family:var(--font-mono);font-size:12.5px;font-weight:800;color:var(--accent)}
  .rm-item.due .rm-when{color:var(--bad)}
  .rm-who{flex:1;min-width:0}
  .rm-who .nm{font-weight:700;font-size:14px;color:var(--tx-1)}
  .rm-who .co{font-size:12px;color:var(--tx-3)}
  .rm-acts{display:flex;gap:6px;flex:0 0 auto}
  .rm-acts button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--tx-1)}
  .rm-acts .done{color:var(--good);border-color:var(--good)}
  .rm-empty{padding:44px;text-align:center;color:var(--tx-3);font-size:14px}
  /* ---- Prospecting view ---- */
  .prospview{grid-column:2;grid-row:1;min-height:0;overflow:auto;background:var(--surface-0)}
  .prosp{padding:22px 26px;max-width:1080px}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
  .pttl{font-size:20px;font-weight:800;color:var(--tx-1);margin:0}
  .psub{font-size:13px;color:var(--tx-3);margin:4px 0 0;max-width:60ch;line-height:1.5}
  .pref{border:1px solid var(--line);background:var(--surface-1);border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--tx-2);flex:0 0 auto}
  .pwarn{border:1px solid var(--bad);background:var(--bad-soft);color:var(--tx-1);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
  .pwarn code{font-family:var(--font-mono);font-size:11.5px;background:rgba(0,0,0,.18);padding:1px 5px;border-radius:4px}
  .psweep{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-1);margin-bottom:14px}
  .pfield{display:flex;flex-direction:column;gap:5px;flex:1 1 130px}
  .pfield.sm{flex:0 0 96px}
  .pfield label{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--tx-3);text-transform:uppercase}
  .pfield input,.pfield select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--tx-1);font-family:inherit}
  .pfield input:focus,.pfield select:focus{outline:none;border-color:var(--accent)}
  .pgo{border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13.5px;border-radius:10px;padding:10px 20px;cursor:pointer;flex:0 0 auto;height:38px}
  .pgo:disabled{opacity:.6;cursor:default}
  .prun-live{margin-bottom:12px}
  .pruns{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-1);padding:6px 12px}
  .pruns summary{font-size:12.5px;font-weight:700;color:var(--tx-2);cursor:pointer;padding:6px 0}
  .prun{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);margin:8px 0}
  .prun-live .prun{border-color:var(--accent);background:var(--accent-soft)}
  .prun-t{font-size:13px;color:var(--tx-1);display:flex;align-items:center;gap:2px}
  .prun-m{font-size:12px;color:var(--tx-3);margin-top:2px}
  .prun-rn{margin-left:auto;font-size:11px;font-weight:700;color:var(--tx-3);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px}
  .prun-rn:hover{color:var(--accent);background:var(--accent-soft)}
  .pcost{font-family:var(--font-mono);font-weight:700;color:var(--tx-2)}
  .pst{font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;margin-left:6px}
  .pst.run{background:var(--accent-soft);color:var(--accent)}
  .pst.pause{background:var(--warn-soft,rgba(240,180,40,.15));color:var(--warn,#e0a020)}
  .pst.done{background:var(--good-soft,rgba(0,185,133,.12));color:var(--good)}
  .ptiers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .ptier{border:1px solid var(--line);background:var(--surface-1);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--tx-2);display:inline-flex;align-items:center;gap:7px}
  .ptier.on{border-color:var(--accent);color:var(--tx-1);background:var(--accent-soft)}
  .ptier .pn{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);border-radius:12px;padding:0 7px;color:var(--tx-3)}
  .ptier.on .pn{background:var(--accent);color:var(--on-accent)}
  .plist{display:flex;flex-direction:column;gap:9px}
  .pcard{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--surface-1)}
  .pcard.hot{border-color:var(--accent)}
  .pscore{flex:0 0 46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:800;font-size:17px;background:var(--surface-2);color:var(--tx-3)}
  .pscore.hot{background:var(--accent);color:var(--on-accent)}
  .pscore.warm{background:var(--accent-soft);color:var(--accent)}
  .pscore.cold{background:var(--surface-2);color:var(--tx-2)}
  .pmain{flex:1;min-width:0}
  .pnm{font-weight:700;font-size:14.5px;color:var(--tx-1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pmeta{font-size:12px;color:var(--tx-3);margin-top:3px}
  .pdom{color:var(--accent);text-decoration:none}
  .pdom.none{color:var(--tx-3)}
  .pbadge{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
  .pbadge.hot{background:var(--accent);color:var(--on-accent)}
  .pbadge.warm{background:var(--accent-soft);color:var(--accent)}
  .pbadge.cold,.pbadge.dead,.pbadge.no_site,.pbadge.unscored{background:var(--surface-2);color:var(--tx-3)}
  .pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .pchip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--tx-2);border:1px solid var(--line)}
  .pchip.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .pchip.soft{color:var(--tx-3);font-weight:600}
  .pact{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .ppromote{border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12.5px;border-radius:9px;padding:8px 14px;cursor:pointer}
  .psupp{border:1px solid var(--line);background:var(--surface-2);color:var(--tx-3);border-radius:9px;width:30px;height:30px;cursor:pointer;font-size:13px}
  .pdone{font-size:12px;font-weight:700;color:var(--good)}
  /* ---- Batch Triage ---- */
  .pcsv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-1);margin-bottom:14px}
  .pcsv-l{font-size:12.5px;color:var(--tx-2)} .pcsv-l code{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--tx-1)}
  .pcsv-btn{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .pcsv-name{font-size:12px;color:var(--tx-3);font-family:var(--font-mono)}
  .pchk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto} .pchk-sp{width:16px;flex:0 0 auto}
  .pcard.sel{background:var(--accent-soft);border-color:var(--accent)}
  .pnm-b{cursor:pointer} .pnm-b:not(.none):hover{color:var(--accent);text-decoration:underline} .pnm-b.none{cursor:default}
  .prec{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--warn);margin-left:6px}
  .psrc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:11px}
  .psrc-from{color:var(--tx-3);font-family:var(--font-mono)}
  .pwhy{color:var(--tx-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-style:italic}
  .pdbtns{display:flex;gap:4px;flex-wrap:wrap}
  .pdb{font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface-1);color:var(--tx-2);cursor:pointer;white-space:nowrap}

function tracker(seq,isAuto){
  if(!seq.total) return "";
  // Step labels come from the ACTUAL sequence, not a hardcoded default. Speed-to-lead is the
  // only SMS/AI-call sequence; everything else here is email-first (IV = all email).
  const SEQ_STEP_LABELS = {
    "Identified Visitor Outreach": ["Email 1","Email 2","Email 3"],
    "Earn consent (email only)": ["Email 1","Email 2","Pref center"],
    "Cold-to-Demo (multichannel)": ["Email 1","LinkedIn","Email 2","Call","Email 3","Call","Email 4","Email 5"],
    "Re-engagement sprint": ["Email","Call","Email"],
    "Onboarding → activation": ["Welcome","Install","Activate"],
  };
  const L=seq.label||"";
  const mapped = SEQ_STEP_LABELS[L]
    || (L.startsWith("Earn")?SEQ_STEP_LABELS["Earn consent (email only)"]
      : L.startsWith("Identified")?SEQ_STEP_LABELS["Identified Visitor Outreach"]
      : L.startsWith("Cold-to-Demo")?SEQ_STEP_LABELS["Cold-to-Demo (multichannel)"]
      : L.startsWith("Re-eng")?SEQ_STEP_LABELS["Re-engagement sprint"]
      : L.startsWith("Onboard")?SEQ_STEP_LABELS["Onboarding → activation"]
      : L.toLowerCase().includes("nurture")?["Nurture"]
      : null);
  const lbls = mapped || ["SMS","AI call","Email","Next-day"].slice(0,seq.total);
  const exited=["replied","booked","opted_out"].includes(seq.status);
  return `<div class="tracker ${isAuto?'tk-auto':'tk-paused'}">${lbls.map((l,i)=>{
    const n=i+1; const done=n<seq.step||exited&&n<=seq.step; const cur=n===seq.step&&!exited;
    return `<div class="st ${done?'done':''} ${cur?'cur':''}"><div class="bub">${done?'✓':n}</div><div class="cap">${l}</div></div>`;
  }).join("")}</div>`;
}

/* Sanitize the composer's contenteditable HTML to an email-safe allowlist, then wrap it in a
   Gmail-style shell so the reply renders natively in the recipient's inbox. Returns null if empty. */
const RTE_ALLOW=new Set(['B','STRONG','I','EM','U','S','STRIKE','A','UL','OL','LI','P','BR','BLOCKQUOTE','DIV','SPAN','FONT']);
const RTE_STYLE_OK=/^(color|font-weight|font-style|text-decoration|text-align|background-color)$/i;
function rteSanitize(root){
  const clone=root.cloneNode(true);
  const walk=(node)=>{
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===8){ ch.remove(); return; }                 // comments
      if(ch.nodeType!==1) return;                                  // keep text nodes
      const tag=ch.tagName.toUpperCase();
      if(tag==='SCRIPT'||tag==='STYLE'){ ch.remove(); return; }
      if(!RTE_ALLOW.has(tag)){                                     // unwrap unknown tags, keep children
        const f=document.createDocumentFragment(); while(ch.firstChild)f.appendChild(ch.firstChild); ch.replaceWith(f); walk(node); return;
      }
      Array.from(ch.attributes).forEach(a=>{
        const n=a.name.toLowerCase();
        if(n.startsWith('on')){ ch.removeAttribute(a.name); return; }
        if(tag==='A'&&n==='href'){ const h=a.value.trim(); if(!/^(https?:|mailto:)/i.test(h)){ch.removeAttribute('href');} return; }
        if(tag==='FONT'&&n==='color') return;
        if(n==='style'){
          const kept=a.value.split(';').map(s=>s.trim()).filter(Boolean).filter(d=>RTE_STYLE_OK.test((d.split(':')[0]||'').trim())).join('; ');
          if(kept) ch.setAttribute('style',kept); else ch.removeAttribute('style'); return;
        }
        ch.removeAttribute(a.name);
      });
      if(tag==='A'&&ch.getAttribute('href')){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener noreferrer'); }
      walk(ch);
    });
  };
  walk(clone);
  return clone.innerHTML;
}

  return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#202124">${inner}</div>`;
}

  const ch=c?replyChOf(c):null;                        // known channel when we have the object

  const sysPush=(body)=>{ if(c){ c.messages=c.messages||[]; c.messages.push({dir:'system',body,ts:'just now'}); try{renderTab(c);}catch(_){} } else if(window.crmToast){ crmToast(body.replace(/^⚠\s*/,'')); } };
  const restoreDraft=()=>{ openReply(); setTimeout(()=>{const e2=document.getElementById('rte'); if(e2){e2.innerText=text; e2.focus();}},40); };
  const btn=document.querySelector('.rte-send'); const oldLabel=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  try{
    const payload={id:sel,reply:text,html:replyHtml};
    if(ch) payload.channel=ch;                          // only override routing when we know it
    if(ch==='email'){ const sj=document.getElementById('rcSubj'); const sv=sj?sj.value.trim():''; if(sv) payload.subject=sv; }
    const r=await fetch('/api/crm/inbox',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error){
      // Opted-out contact: show WHY, and let them re-enable + resend if it was a mistake.
      if(d.error==='suppressed'){
        const chL=(ch||'email')==='sms'?'texts':(ch||'email')==='voice'?'calls':'email';
        const okp=confirm((d.message||('This contact opted out of '+chL+'.'))+'\n\nWas that a mistake? Click OK to re-enable '+chL+' for this contact and send now. (This is logged.)');
        if(okp){
          const rr=await fetch('/api/crm/inbox',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({unsuppress:true,id:sel,channel:ch||'email'})}).then(x=>x.json()).catch(()=>null);
          if(rr&&rr.ok){ if(window.crmToast)crmToast('✓ '+chL.charAt(0).toUpperCase()+chL.slice(1)+' re-enabled — sending…'); return sendReply(); }
          sysPush('⚠ Couldn’t re-enable '+chL+' — '+((rr&&rr.error)||'error')); restoreDraft(); return;
        }
        sysPush('⛔ Not sent — this contact is opted out of '+chL+'.'); restoreDraft(); return;
      }
      sysPush('⚠ Failed to send — '+(d.message||d.error||('HTTP '+r.status))+'. Not delivered.');
      restoreDraft();
      return;
    }
    if(c){
      c.messages=c.messages||[];
      c.messages.push({dir:'out',channel:d.sent||ch,body:text,html:(ch==='email'?replyHtml:null),ts:'just now',meta:'sent'});
      if(d.status_note) c.messages.push({dir:'system',body:d.status_note,ts:'just now'});
      if(typeof c.unread!=='undefined') c.unread=false;
      replyOpen=false; ATTACH=[];
      try{renderTab(c);}catch(_){}
      const sc=document.querySelector('#tabbody .msgs, #tabbody .gmail'); if(sc)sc.scrollTop=sc.scrollHeight;
    } else {
      replyOpen=false; ATTACH=[];
      if(window.crmToast)crmToast(d.status_note||'✓ Sent');
    }
    if(window._focusMode) focusAdvance(); // Single-Task: reply = done, serve the next
  }catch(e){
    sysPush('⚠ Failed to send — network error.');
    restoreDraft();
  }
  finally{ if(btn){ btn.disabled=false; btn.textContent=oldLabel; } }
}

function gmailThread(c){

    const outName = m.author || (DATA.me&&DATA.me.name) || "Consent Resolve";
    const who = out ? outName : (c.name||"Unknown");

function fmtRemWhen(iso){
  const d=new Date(iso), now=new Date();
  const sameDay=(a,b)=>a.toDateString()===b.toDateString();
  const tmr=new Date(now); tmr.setDate(now.getDate()+1);
  let day = sameDay(d,now)?'Today' : sameDay(d,tmr)?'Tomorrow' : d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  return day+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

function quickTime(kind){
  const at=(base,h)=>{ base.setHours(h,0,0,0); return base; };
  const d=new Date(); d.setSeconds(0,0);
  if(kind==='2h'){ d.setHours(d.getHours()+2); d.setMinutes(0,0,0); return d; }
  if(kind==='tmr9'){ d.setDate(d.getDate()+1); return at(d,9); }
  if(kind==='tmr14'){ d.setDate(d.getDate()+1); return at(d,14); }
  if(kind==='fri9'||kind==='mon9'){ const target=kind==='fri9'?5:1; const day=d.getDay(); let add=(target-day+7)%7; if(add===0)add=7; d.setDate(d.getDate()+add); return at(d,9); }
  return d;
}

function placeMenu(menu, ev){
  const btn=ev&&ev.currentTarget; const r=btn?btn.getBoundingClientRect():{left:innerWidth/2,top:innerHeight-120,bottom:innerHeight-90};
  // Never let the menu run past the viewport — if it did, an item (e.g. the newsletter
  // option) would be clipped off-screen. Cap its height and flip up/down for the best fit.
  menu.style.maxHeight=(innerHeight-16)+'px'; menu.style.overflowY='auto';
  const mh=Math.min(menu.offsetHeight, innerHeight-16), mw=menu.offsetWidth;
  const left=Math.max(8, Math.min(r.left, innerWidth-mw-8));
  let top=r.top-mh-6;                                   // prefer opening upward (bar is at the bottom)
  if(top<8) top=Math.min(r.bottom+6, innerHeight-mh-8); // not enough room above → open below, clamped
  if(top<8) top=8;
  menu.style.left=left+'px'; menu.style.top=top+'px';
}

async function applyAuto(btn,mode){
  const c=DATA.conversations.find(x=>x.id===sel);

  if(c){
    if(mode==='auto' && c.bucket!=='auto') c.bucket='auto';
    else if(mode==='manual' && c.bucket!=='open') c.bucket='open';

  }

        await fetch('/api/crm/inbox',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,pause:true})});

/* ---- Deal tab: stage · trial signup (console username) · traffic→deal-size predictor ---- */
const CR_IDENTIFY_RATE=0.02, CR_PRICE=7;          // ~2% of visitors become consented $7 leads
function predictLeads(v){return Math.round(v*CR_IDENTIFY_RATE);}
function predictValue(v){return predictLeads(v)*CR_PRICE;}
function snap(v){if(v<=100)return 100;if(v>=100000)return 100000;const m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m;}
const DEALSTATE={};
function initStage(id){const c=DATA.conversations.find(x=>x.id===id);if(!c)return'new';const s=c.sequence.status;if(s==='booked'||s==='replied')return'lead';if(s==='opted_out'||s==='blocked')return'lost';return'new';}
function dstate(id){if(!DEALSTATE[id]){const e=(window.ENRICH||{})[id]||{},st=initStage(id);DEALSTATE[id]={stage:st,trial:st==='trial',username:'',visitors:e.traffic_month||1000,value_usd:null,_synced:false};}return DEALSTATE[id];}
/* Seed the Deal tab from the REAL persisted deal (attached to the conversation as c.deal) so the
   Stage + Deal size reflect what's saved — not always "New". Runs once per session per lead. */
const STATUS_TO_STAGE={new:'new',active:'lead',lead:'lead',contacted:'lead',replied:'lead',trial:'trial',won:'customer',customer:'customer',lost:'lost',disqualified:'disqualified'};
function dsyncFromDeal(c){ if(!c||!c.deal)return; const st=dstate(c.id); if(st._synced)return; st._synced=true;
  if(c.deal.status){ st.stage=STATUS_TO_STAGE[String(c.deal.status).toLowerCase()]||st.stage; st.trial=st.stage==='trial'; }
  if(c.deal.value_usd){ st.value_usd=c.deal.value_usd; } }
const STAGE_LABELS={new:'New',lead:'Lead',trial:'Trial',customer:'Customer',lost:'Lost',disqualified:'Disqualified'};
function stageLabelOf(c){ try{ return STAGE_LABELS[dstate(c.id).stage]||'New'; }catch(e){ return 'New'; } }
window.stageLabelOf=stageLabelOf;
const PROB_TO_STAGE={new:'new',active:'lead',trial:'trial',won:'customer',lost:'lost'};
function dealStage(id,stage){
  const st=dstate(id); const prev=st.stage; st.stage=stage; st.trial=(stage==='trial'); rerenderDeal(id);
  // Persist so the stage survives a refresh and drives the Pipeline (server buckets by lead_status).
  const MAP={'new':{lead_status:'new',close_probability:10},lead:{lead_status:'active',close_probability:50},trial:{lead_status:'trial',close_probability:70},customer:{lead_status:'won',close_probability:100},lost:{lead_status:'lost'}};
  const p=MAP[stage]; if(!p||String(id).startsWith('c0')) return;   // demo ids: local only
  // Keyed by the CONVERSATION id — the server find-or-creates the deal, then updates lead_status.
  fetch('/api/crm/deals',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({conversation:id,disqualify_reason:''},p))})
    .then(r=>r.json()).then(j=>{
      if(!j||!j.ok){ st.stage=prev; st.trial=(prev==='trial'); rerenderDeal(id); if(window.crmToast)crmToast('Could not save stage — reverted'); return; }
      if(window.PIPELINE&&j.id){ const dl=window.PIPELINE.find(x=>x.id===j.id); if(dl){ dl.stage=PROB_TO_STAGE[p.lead_status]||dl.stage; dl.status=p.lead_status; if(p.close_probability!=null)dl.prob=p.close_probability; } const pv=document.getElementById('pipelineview'); if(pv&&!pv.hidden)renderPipeline(); }
      if(window.crmToast)crmToast('Stage saved · '+(STAGE_LABELS[stage]||stage));
    }).catch(()=>{ st.stage=prev; st.trial=(prev==='trial'); rerenderDeal(id); if(window.crmToast)crmToast('Could not save stage — reverted'); });
}
/* Deal size — editable dollar value, persisted to the deal's value_cents (keyed by conversation). */
function dealSizeSave(id,dollars){
  const st=dstate(id); const n=Math.max(0,Math.round(Number(dollars)||0)); const prev=st.value_usd; st.value_usd=n;
  if(String(id).startsWith('c0')) return;   // demo ids: local only
  fetch('/api/crm/deals',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation:id,value_cents:n*100})})
    .then(r=>r.json()).then(j=>{
      if(!j||!j.ok){ st.value_usd=prev; if(window.crmToast)crmToast('Could not save deal size — reverted'); return; }
      if(window.PIPELINE&&j.id){ const dl=window.PIPELINE.find(x=>x.id===j.id); if(dl)dl.value_usd=n; const pv=document.getElementById('pipelineview'); if(pv&&!pv.hidden)renderPipeline(); }
      if(window.crmToast)crmToast('Deal size saved · $'+n.toLocaleString());
    }).catch(()=>{ st.value_usd=prev; if(window.crmToast)crmToast('Could not save deal size — reverted'); });
}
function dealSizeUse(id){ const st=dstate(id); const est=predictValue(st.visitors)*12; const inp=document.getElementById('dsize'); if(inp)inp.value=est; dealSizeSave(id,est); }

/* Disqualify / requalify straight from the lead's Stage tab. Persists via /api/crm/deals
   keyed by the CONVERSATION id (find-or-create the deal server-side) + runs the cascade. */
async function dealTabDisqualify(id){
  const reason=(prompt('Disqualify this lead — reason? (adds them to do-not-contact and archives the thread)','Not a fit')||'').trim();
  if(reason===null) return;
  const st=dstate(id); const prev={stage:st.stage,reason:st.disqualify_reason};
  st.stage='disqualified'; st.disqualify_reason=reason||'(no reason given)'; rerenderDeal(id);
  const r=await fetch('/api/crm/deals',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({disqualify_conversation:id,disqualify_reason:reason})}).then(x=>x.json()).catch(()=>null);
  if(!r||!r.ok){ st.stage=prev.stage; st.disqualify_reason=prev.reason; rerenderDeal(id); if(window.crmToast)crmToast('Could not disqualify — reverted'); return; }
  // keep the pipeline in sync if it's loaded
  if(window.PIPELINE){ const dl=window.PIPELINE.find(x=>x.id===r.id); if(dl){dl.stage='disqualified';dl.status='disqualified';dl.disqualify_reason=reason;} }
  if(window.crmToast)crmToast('Disqualified — archived & added to do-not-contact');
  if(window._focusMode) focusAdvance(); // Single-Task: disqualify = done, serve the next
}
async function dealTabRequalify(id){
  const st=dstate(id); const prev={stage:st.stage,reason:st.disqualify_reason};
  st.stage='new'; st.disqualify_reason=null; rerenderDeal(id);
  const r=await fetch('/api/crm/deals',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({requalify_conversation:id})}).then(x=>x.json()).catch(()=>null);
  if(!r||!r.ok){ st.stage=prev.stage; st.disqualify_reason=prev.reason; rerenderDeal(id); if(window.crmToast)crmToast('Could not requalify — reverted'); return; }
  if(window.PIPELINE){ const dl=window.PIPELINE.find(x=>x.id===r.id); if(dl){dl.stage='new';dl.status='active';dl.disqualify_reason=null;} }
  if(window.crmToast)crmToast('Requalified — back in New. (Still on do-not-contact; clear it in Consent if needed.)');
}
window.dealTabDisqualify=dealTabDisqualify; window.dealTabRequalify=dealTabRequalify;

function dealTraffic(id,pct){const v=snap(Math.round(100*Math.pow(1000,pct/100)));dstate(id).visitors=v;
  const set=(k,val)=>{const el=document.getElementById(k);if(el)el.textContent=val;};
  set('dvalue',predictValue(v).toLocaleString());set('dyear',(predictValue(v)*12).toLocaleString());
  set('dvisits',v.toLocaleString());set('dleads',predictLeads(v).toLocaleString());}
function rerenderDeal(id){

/* ---- view switching (Inbox ⇄ Pipeline) ---- */
function showView(v){
  // Leaving the inbox must stop any live "Watch" poll — otherwise the 3s Retell poll keeps
  // running on other screens forever (rate-limit + battery drain).
  if(v!=='inbox' && typeof stopChatPoll==='function') stopChatPoll();
  document.querySelectorAll('.rail a[data-view]').forEach(a=>a.classList.toggle('on', a.dataset.view===v));

// Smooth progress: poll the run status and PATCH the bar/counts in place — no full re-render
// (which caused the jarring "constant refresh"). A single full refresh fires only on completion,
// so the newly-scored, ranked list appears once when everything is done.
async function pollRunProgress(){
  if(window.__crmView!=='prospecting'){ _prospPoll=null; return; }
  let d=null; try{ d=await prospGet('?tier='+encodeURIComponent(PROSP.tier)); }catch(_){}
  if(!d||!d.ok){ _prospPoll=setTimeout(pollRunProgress, 6000); return; }
  const wasActive=(PROSP.runs||[]).some(r=>r.status==='running');
  PROSP.runs=d.runs||[]; PROSP.tierCounts=d.tierCounts||{};
  let stillActive=false;
  PROSP.runs.forEach(r=>{
    if(r.status==='running') stillActive=true;
    const card=document.querySelector('.rp-card[data-run="'+r.id+'"]'); if(!card) return;
    const pg=r.progress||{}, c=r.counts||{};
    const fill=card.querySelector('.rp-fill'); if(fill) fill.style.width=(pg.pct||0)+'%';
    const cnt=card.querySelector('.rp-count'); if(cnt) cnt.innerHTML='<b>'+(pg.done||0)+'</b> of '+(pg.total||0)+' enriched · '+(pg.pct||0)+'%';
    const t=card.querySelector('.rp-tiers'); if(t) t.innerHTML=rpTiers(c);
    const cost=card.querySelector('.rp-cost'); if(cost) cost.textContent='$'+(r.cost||0).toFixed(2);

  });
  if(stillActive){ _prospPoll=setTimeout(pollRunProgress, 3500); }
  else if(wasActive){ // just finished → one clean refresh to reveal the scored, ranked list
    if(window.crmToast) crmToast('Enrichment complete — list ranked'); renderProspecting(true);
  } else { _prospPoll=null; }
}

  host.innerHTML='<div style="padding:56px;text-align:center;color:var(--tx-3)">Loading settings…</div>';
  let d=null, lc={};
  try{ d=await stlApi('GET'); }catch(e){}
  try{ lc=await (await fetch('/api/chat-launcher',{credentials:'same-origin'})).json(); }catch(e){}
  if(!d||!d.ok){ host.innerHTML='<div class="prosp"><div class="phead"><h2 class="pttl">Settings</h2></div><div class="idash-empty" style="padding:40px">Couldn’t load the Speed-to-Lead engine.</div></div>'; return; }
  STL=d;
  paintSettings(d, lc||{});
  try{ if(window.stCheck && window.renderSingleTaskSetting){ await stCheck(); renderSingleTaskSetting(document.getElementById('settingsview')); } }catch(_){}
}
function paintSettings(d, lc){
  const host=document.getElementById('settingsview'); const s=d.settings||{}, m=d.metrics||{}, r=d.readiness||{};
  const live=s.mode==='live', paused=s.paused==='1';

  const sw=(id,lbl,on)=>`<label class="set-sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${lbl}</span></label>`;
  const K=(v,l,cls)=>`<div class="set-kpi ${cls||''}"><div class="v">${v==null?'—':v}</div><div class="l">${l}</div></div>`;
  const kpis=[
    K((m.leads_total||0)+' ('+(m.leads_A||0)+'A/'+(m.leads_B||0)+'B)','Leads'),
    K(m.speed_to_first_ring_p95_s==null?'—':m.speed_to_first_ring_p95_s+'s','Speed to first ring p95', m.speed_to_first_ring_p95_s>60?'alarm':'good'),
    K(m.sla_breach_rate_pct==null?'—':m.sla_breach_rate_pct+'%','SLA breach (>5m)'),
    K(m.identified_contacted_60m_pct==null?'—':m.identified_contacted_60m_pct+'%','A contacted <60m'),
    K(m.gate_violations||0,'Gate violations', (m.gate_violations>0)?'alarm':'good'),
    K(m.cookie_leak_flags||0,'Cookie-banner leaks', (m.cookie_leak_flags>0)?'alarm':'good'),
    K(m.transfer_accept_rate_pct==null?'—':m.transfer_accept_rate_pct+'%','Transfer accept rate'),
    K((m.dispatch_by_mode&&(m.dispatch_by_mode.live||0))+' / '+(m.dispatch_by_mode&&(m.dispatch_by_mode.simulate||0)),'Live / simulated sends'),
  ].join('');
  const chip=(ok,label,note)=>`<div class="set-kpi ${ok?'good':''}"><div class="v" style="font-size:14px">${ok?'● ready':'○ not set'}</div><div class="l">${escP(label)}${note?` <span style="color:var(--tx-3)">${escP(note)}</span>`:''}</div></div>`;
  const readiness=[
    chip(r.email_gmail,'Email (Gmail: '+(r.email_gmail||'—')+')'),
    chip(r.retell_key,'Retell key'),
    chip(r.retell_agent&&r.retell_from,'Retell agent + number'),
    chip(r.twilio&&r.twilio_from,'Twilio (SMS)'),
    chip(r.calcom,'Cal.com secret'),
    chip(r.alert_url,'Alerts / paging'),
    chip(!!r.booking_link,'Booking link'),
    chip(r.verify_webhooks,'Webhook signatures'),
  ].join('');
  const reps=d.reps||[];
  const REP_RANK={1:'Primary',2:'Backup 1',3:'Backup 2'};
  const repRows=reps.length?reps.map(rp=>{const rank=REP_RANK[rp.priority]||('P'+rp.priority);
    return `<tr><td>${escP(rank)}</td><td>${escP(rp.name)}</td><td class="mono">${escP(rp.phone)}</td>
      <td>${rp.available?'<span style="color:var(--good);font-weight:700">● available</span>':'<span style="color:var(--tx-3)">○ away</span>'} · <a href="#" onclick="stlRepState('${rp.id}','${rp.available?'away':'available'}');return false">${rp.available?'set away':'set available'}</a></td>
      <td><a href="#" onclick="stlRemoveRep('${rp.id}');return false" style="color:var(--bad)">remove</a></td></tr>`;}).join('')
    :'<tr><td colspan="5" style="color:var(--tx-3)">No reps yet — add your primary + backups so Mack can warm-transfer.</td></tr>';
  const vio=(d.violations||[]);
  const errs=(d.errors||[]);
  const vTbl=vio.length?`<table class="set-tbl"><tr><th>When</th><th>Channel</th><th>Reason</th><th>Lead</th></tr>${vio.slice(0,20).map(v=>`<tr><td>${stlTs(v.attempted_at)}</td><td>${escP(v.channel)}</td><td style="color:var(--bad)">${escP(v.reason)}</td><td class="mono">${escP((v.lead_id||'').slice(0,8))}</td></tr>`).join('')}</table>`:'<span style="color:var(--tx-3)">none — clean ✓</span>';
  const eTbl=errs.length?`<table class="set-tbl"><tr><th>When</th><th>Kind</th><th>Detail</th></tr>${errs.slice(0,20).map(e=>{let dt='';try{dt=e.detail?JSON.stringify(JSON.parse(e.detail)):''}catch(_){dt=e.detail||''}return `<tr><td>${stlTs(e.at)}</td><td style="color:var(--bad)">${escP(e.kind)}</td><td class="mono">${escP(String(dt).slice(0,120))}</td></tr>`;}).join('')}</table>`:'<span style="color:var(--tx-3)">none</span>';
  const t=lc.teaser||{}, n=lc.nudge||{};
  const testCount=(d.leads||[]).filter(l=>l.is_test).length;

  host.innerHTML=`<div class="prosp set-wrap">
    <div class="phead"><div><h2 class="pttl">Settings — Speed-to-Lead</h2><p class="psub">The real-time engine that works a lead the instant it lands. Flip channels live, provision the AI agent, tune the website chat launcher, and manage transfer reps.</p></div>
      <div style="display:flex;align-items:center;gap:10px">${modeBadge}<button class="pref" onclick="renderSettings(true)" title="Refresh">↻</button></div></div>

    <div class="set-card">
      <h3 class="set-h">Dispatch mode</h3>
      <div class="set-row">
        <label class="set-sw"><input type="radio" name="stmode" id="st_sim" ${!live?'checked':''}><span>Simulate (records intended sends, dispatches nothing)</span></label>
        <label class="set-sw"><input type="radio" name="stmode" id="st_live" ${live?'checked':''}><span>Live</span></label>
        ${sw('st_paused','⛔ Pause all (kill switch)',paused)}
      </div>
      <div class="set-grid4" style="margin-top:10px">
        ${sw('st_live_email','Live: Email',s.live_email==='1')}
        ${sw('st_live_sms','Live: SMS',s.live_sms==='1')}
        ${sw('st_live_call_ai','Live: AI voice',s.live_call_ai==='1')}
        ${sw('st_live_call_human','Live: Human dial',s.live_call_human==='1')}
      </div>
      ${live&&!paused?'<div class="set-warn">⚠ Live mode is ON — channels toggled Live will send for real.</div>':''}
      <div class="set-row" style="margin-top:12px"><button class="pgo" onclick="stlSaveMode()">Save mode</button><span id="st_msg" style="color:var(--tx-3);font-size:12.5px"></span></div>
    </div>

    <div class="set-card"><h3 class="set-h">Engine metrics</h3><div class="set-grid4">${kpis}</div></div>

    <div class="set-card">
      <h3 class="set-h">Integrations &amp; go-live</h3>
      <div class="set-grid4">${readiness}</div>
      <div class="set-row" style="margin-top:14px">
        <button class="pgo" onclick="stlProvision('retell_setup',this)">⚡ Provision Mack (Retell)</button>
        <button class="set-ghost" onclick="stlProvision('retell_kb',this)">📚 Knowledge base</button>
        <button class="set-ghost" onclick="stlProvision('retell_chat_agent',this)">💬 Website chat agent</button>
        <button class="set-ghost" onclick="stlProvision('retell_numbers',this)">List Retell numbers</button>
      </div>
      <pre id="st_intg" class="set-out"></pre>
    </div>

    <div class="set-card">
      <h3 class="set-h">Website chat launcher <span class="set-note">— the orb + teaser that front Mack. Saves live, no redeploy.</span></h3>
      <div class="set-row">
        ${sw('cl_enabled','Launcher on',lc.enabled!==false)}
        <label class="set-sw" style="gap:6px"><span>Badge</span><select id="cl_badge" class="set-in" style="width:auto"><option value="honest"${(lc.badge||'honest')==='honest'?' selected':''}>Honest</option><option value="always"${lc.badge==='always'?' selected':''}>Always</option><option value="off"${lc.badge==='off'?' selected':''}>Off</option></select></label>
      </div>
      <div class="set-grid2" style="margin-top:10px">
        <div><label class="set-lbl">Agent name</label><input id="cl_agentName" class="set-in" value="${escP(lc.agentName||'')}" placeholder="Mack"></div>
        <div><label class="set-lbl">Status line</label><input id="cl_status" class="set-in" value="${escP(lc.status||'')}" placeholder="AI assistant · a human when you ask"></div>
        <div><label class="set-lbl">Phone (E.164)</label><input id="cl_phone" class="set-in" value="${escP(lc.phone||'')}" placeholder="+17279999846"></div>
        <div><label class="set-lbl">Orb entrance delay (s)</label><input id="cl_entrance" class="set-in" type="number" step="0.1" min="0" max="60" value="${(lc.entranceDelay||0)/1000}"></div>
        <div style="grid-column:1/-1"><label class="set-lbl">Teaser greeting</label><input id="cl_greeting" class="set-in" value="${escP(lc.greeting||'')}" placeholder="Hey — want a price, or a time slot?"></div>
      </div>
      <div class="set-grid4" style="margin-top:10px">
        ${sw('cl_teaser_enabled','Show teaser',t.enabled!==false)}
        ${sw('cl_teaser_exit','Exit-intent',t.exitIntent!==false)}
        <div><label class="set-lbl">Teaser after (s)</label><input id="cl_teaser_delay" class="set-in" type="number" step="0.5" min="0" max="600" value="${(t.delay||0)/1000}"></div>
        <div><label class="set-lbl">…or scroll (%)</label><input id="cl_teaser_scroll" class="set-in" type="number" step="1" min="0" max="100" value="${Math.round((t.scroll||0)*100)}"></div>
      </div>
      <div class="set-grid4" style="margin-top:10px">
        ${sw('cl_nudge_enabled','Nudge wiggle',n.enabled!==false)}
        <div><label class="set-lbl">Wiggle every (s)</label><input id="cl_nudge_every" class="set-in" type="number" step="1" min="0" max="600" value="${(n.every||0)/1000}"></div>
        <div><label class="set-lbl">Stop after (times)</label><input id="cl_nudge_max" class="set-in" type="number" step="1" min="0" max="50" value="${n.max==null?3:n.max}"></div>
      </div>
      <div class="set-row" style="margin-top:12px"><button class="pgo" onclick="stlSaveLauncher()">Save launcher</button><a href="/" target="_blank" rel="noopener"><button class="set-ghost" type="button">Preview on site ↗</button></a><span id="cl_msg" style="color:var(--tx-3);font-size:12.5px"></span></div>
    </div>

    <div class="set-card">
      <h3 class="set-h">Transfer reps <span class="set-note">— Mack warm-transfers a live call to the highest-rank rep who's on shift.</span></h3>
      <table class="set-tbl" style="width:auto;min-width:420px"><tr><th>Rank</th><th>Rep</th><th>Phone</th><th>On shift</th><th></th></tr>${repRows}</table>
      <div class="set-row" style="margin-top:10px">
        <input id="st_repName" class="set-in" style="max-width:130px" placeholder="Rep name">
        <input id="st_repPhone" class="set-in" style="max-width:170px" placeholder="+17135551234">
        <select id="st_repPriority" class="set-in" style="max-width:130px"><option value="1">Primary</option><option value="2">Backup 1</option><option value="3">Backup 2</option></select>
        <button class="set-ghost" onclick="stlAddRep()">+ Add rep</button><span id="st_repMsg" style="color:var(--tx-3);font-size:12.5px"></span>
      </div>
    </div>

    <div class="set-grid2">
      <div class="set-card"><h3 class="set-h">Gate violations <span class="set-note">— target: zero</span></h3>${vTbl}</div>
      <div class="set-card"><h3 class="set-h">Recent send errors</h3>${eTbl}</div>
    </div>

    ${testCount?`<div class="set-card" style="border-color:var(--bad)"><h3 class="set-h">Maintenance</h3><p style="color:var(--tx-3);font-size:13px;margin:0 0 10px">${testCount} test lead${testCount===1?'':'s'} from bring-up are still in the engine. Purge them for a clean production start.</p><button class="set-danger" onclick="stlPurgeTests()">Delete ${testCount} test lead${testCount===1?'':'s'}</button> <span id="st_purge" style="color:var(--tx-3);font-size:12.5px"></span></div>`:''}
  </div>`;
}
function stlTs(t){ return t?new Date(t).toLocaleString():'—'; }
async function stlSaveMode(){
  const settings={ mode:document.getElementById('st_live').checked?'live':'simulate', paused:document.getElementById('st_paused').checked?'1':'0' };
  ['live_email','live_sms','live_call_ai','live_call_human'].forEach(k=>settings[k]=document.getElementById('st_'+k).checked?'1':'0');
  const msg=document.getElementById('st_msg'); if(msg)msg.textContent='saving…';
  const d=await stlApi('POST',{action:'set_settings',settings}); if(msg)msg.textContent=d.ok?'saved ✓':'error'; renderSettings(true);
}
async function stlProvision(action,btn){ const out=document.getElementById('st_intg'); if(out)out.textContent='working…'; if(btn)btn.disabled=true; const d=await stlApi('POST',{action}); if(out)out.textContent=JSON.stringify(d,null,2); if(btn)btn.disabled=false; }
async function stlAddRep(){ const name=(document.getElementById('st_repName').value||'').trim()||'Rep', phone=(document.getElementById('st_repPhone').value||'').trim(), priority=document.getElementById('st_repPriority').value; const msg=document.getElementById('st_repMsg'); if(!phone){ if(msg)msg.textContent='enter the rep phone (E.164)'; return; } const d=await stlApi('POST',{action:'seed_rep',name,phone,priority}); if(d.ok) renderSettings(true); else if(msg)msg.textContent='error: '+(d.error||''); }
async function stlRemoveRep(id){ await stlApi('POST',{action:'delete_rep',rep_id:id}); renderSettings(true); }
async function stlRepState(id,state){ await stlApi('POST',{action:'set_rep_state',rep_id:id,state}); renderSettings(true); }
async function stlPurgeTests(){ if(!confirm('Delete ALL test leads and their touchpoints from the engine?'))return; const p=document.getElementById('st_purge'); if(p)p.textContent='deleting…'; const d=await stlApi('POST',{action:'reset_tests'}); if(p)p.textContent=d.ok?('deleted '+(d.deleted||0)):'error'; renderSettings(true); }
async function stlSaveLauncher(){
  const num=(id)=>{const v=parseFloat((document.getElementById(id)||{}).value);return isFinite(v)?v:0;};
  const g=id=>document.getElementById(id);
  const config={ enabled:g('cl_enabled').checked, badge:g('cl_badge').value, agentName:g('cl_agentName').value.trim(), status:g('cl_status').value.trim(), phone:g('cl_phone').value.trim(), greeting:g('cl_greeting').value.trim(), entranceDelay:Math.round(num('cl_entrance')*1000),
    teaser:{ enabled:g('cl_teaser_enabled').checked, exitIntent:g('cl_teaser_exit').checked, delay:Math.round(num('cl_teaser_delay')*1000), scroll:Math.min(1,Math.max(0,num('cl_teaser_scroll')/100)) },
    nudge:{ enabled:g('cl_nudge_enabled').checked, every:Math.round(num('cl_nudge_every')*1000), max:Math.round(num('cl_nudge_max')) } };
  const msg=g('cl_msg'); if(msg)msg.textContent='saving…';
  try{ const r=await fetch('/api/chat-launcher',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({config})}); const d=await r.json(); if(msg)msg.textContent=d.ok?'saved ✓ — live within ~1 min':('error: '+(d.error||r.status)); }catch(e){ if(msg)msg.textContent='error'; }
}
window.renderSettings=renderSettings; window.stlSaveMode=stlSaveMode; window.stlProvision=stlProvision; window.stlAddRep=stlAddRep; window.stlRemoveRep=stlRemoveRep; window.stlRepState=stlRepState; window.stlPurgeTests=stlPurgeTests; window.stlSaveLauncher=stlSaveLauncher;

// DEFERRED to a macrotask so every render helper (const/fn defined later in this
// script) is initialized first — otherwise restoring #sitespy hit a TDZ error and
// blanked the app. Wrapped so any failure falls back to the default Inbox.
// ===== Deep-links: land anywhere — #<view> opens a view, #<view>/<recordId> opens a record.
// A pasted link switches to the view and opens the exact record once its data is loaded.
var VALID_VIEWS={inbox:1,reminders:1,pipeline:1,contacts:1,companies:1,nurture:1,sitespy:1,sequences:1,analytics:1,consent:1,newsletter:1,prospecting:1,agency:1,settings:1};
// Per-view "open this record by id". A view not listed just opens (record id ignored).
var RECORD_OPENERS={
  inbox:function(id){ if(window.select) select(id); },
  pipeline:function(id){ if(window.openDealDetail) openDealDetail(id); },
  prospecting:function(id){ if(window.prospOpenDossier) prospOpenDossier(id); },

// Is the record's data loaded yet? (Its list must be in memory before the opener can find it.)
function recordReady(view,id){ try{
  if(view==='inbox') return !!(window.DATA&&DATA.conversations&&DATA.conversations.some(function(c){return c.id===id;}));
  if(view==='pipeline') return !!(window.PIPELINE&&window.PIPELINE.some(function(d){return d.id===id;}));
  if(view==='prospecting') return !!(window.PROSP&&PROSP.prospects&&PROSP.prospects.some(function(x){return x.id===id;}));
  return true;
}catch(e){ return true; } }
// Parse the URL hash → {view, id, lead}. Record links are #<view>/<id> (legacy #lead/<id> = inbox).
function parseHash(){
  var h=decodeURIComponent(location.hash.slice(1)||'');
  var m=h.match(/^([a-z-]+)\/(.+)$/i);
  if(m){ var v=(m[1]==='lead')?'inbox':m[1]; return {view:v, id:m[2], lead:(v==='inbox'?m[2]:null)}; }
  return {view:h||'', id:null, lead:null};
}
// Open the hash's record (switch view + open it). If the data isn't in yet, stash it — the
// live-data bootstrap re-calls this once records land.
function applyRecordHash(){
  try{
    var p=parseHash(); if(!p.id) return false;
    // Contact/Company records are fetched by id (no in-memory list) — open them directly.
    if(p.view==='contact'){ if(window.openContactRecord) window.openContactRecord(p.id); return true; }
    if(p.view==='company'){ if(window.openCompanyRecord) window.openCompanyRecord(p.id); return true; }
    var view=VALID_VIEWS[p.view]?p.view:'inbox';
    var opener=RECORD_OPENERS[view];
    if(window.__crmView!==view){ try{ showView(view); }catch(e){} }  // switch → also triggers the view's data load
    if(!opener) return false;
    var tries=0;
    (function attempt(){
      if(recordReady(view,p.id)){
        try{ opener(p.id); }catch(e){}
        try{ history.replaceState(null,'','#'+view+'/'+p.id); }catch(e){} // keep the record in the URL (showView reset it to the view)
        return;
      }
      if(++tries<25) setTimeout(attempt,200);  // poll ~5s while the view's data streams in
    })();
    return true;
  }catch(e){ return false; }
}
// Back-compat alias — the live-data bootstrap calls applyLeadHash() after data lands.
function applyLeadHash(){ return applyRecordHash(); }
function restoreView(){
  try{
    var p=parseHash();
    if(p.id){ applyRecordHash(); return; }  // #<view>/<id> → land on that record
    var v=p.view;
    if(!VALID_VIEWS[v]){ try{ v=localStorage.getItem('crm_view')||''; }catch(e){ v=''; } }
    if(VALID_VIEWS[v] && v!=='inbox') showView(v);
  }catch(e){ if(window.console) console.warn('restoreView failed', e); }
}

function playBell(){ if(!_bellOn) return; try{
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const ac=window._crmAC||(window._crmAC=new AC()); if(ac.state==='suspended') ac.resume();
  const t=ac.currentTime;
  [880,1320].forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=f;
    const s=t+i*0.055; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(i?0.11:0.2,s+0.008); g.gain.exponentialRampToValueAtTime(0.0001,s+0.5);
    o.connect(g).connect(ac.destination); o.start(s); o.stop(s+0.55); });
}catch(e){} }
function toggleBell(btn){ _bellOn=!_bellOn; try{localStorage.setItem('crm_bell',_bellOn?'1':'0');}catch(e){} if(btn)btn.textContent=_bellOn?'🔔':'🔕'; if(_bellOn)playBell(); }

function fmtWhen(t){ if(!t) return '—'; const d=new Date(t); if(isNaN(d)) return esc(String(t)); return d.toLocaleString(); }

const PSTAGES=[['new','New'],['lead','Lead'],['trial','Trial'],['customer','Customer'],['lost','Lost']];
let dragId=null;

function pipeDrop(e,stage){e.preventDefault();e.currentTarget.classList.remove('dragover');

/* live-data drop: persists the stage change to the real deal via POST /api/crm/deals.
   Column -> {lead_status, close_probability} mapping; optimistic re-render, revert on failure. */
function pipeDropReal(e,stage){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const id=dragId; dragId=null;
  if(!id||!window.PIPELINE) return;
  const d=window.PIPELINE.find(x=>x.id===id);
  if(!d||d.stage===stage) return;
  // Disqualifying needs a reason (and archives + stops contact) — route through the modal.
  if(stage==='disqualified'){ openDisqualify(id); return; }
  const wasDq = d.stage==='disqualified';
  const map={'new':{lead_status:'new',close_probability:10},lead:{lead_status:'active',close_probability:50},trial:{lead_status:'trial',close_probability:70},customer:{lead_status:'won',close_probability:100},lost:{lead_status:'lost'}};
  const payload=map[stage]; if(!payload) return;
  if(wasDq) payload.disqualify_reason='';   // dragging OUT of disqualified = requalify, clear the reason
  const prev={stage:d.stage,prob:d.prob,status:d.status,reason:d.disqualify_reason};
  d.stage=stage; d.status=payload.lead_status;
  if(payload.close_probability!=null) d.prob=payload.close_probability;
  if(wasDq) d.disqualify_reason=null;
  renderPipeline();
  fetch('/api/crm/deals',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({id},payload))})
    .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(j=>{ if(!j||j.ok!==true) throw new Error('bad response'); if(wasDq&&window.crmToast) crmToast('Requalified. Note: still on do-not-contact — clear it in Consent if needed.'); })
    .catch(err=>{ d.stage=prev.stage; d.prob=prev.prob; d.status=prev.status; d.disqualify_reason=prev.reason; renderPipeline(); if(window.console) console.warn('deal update failed, reverted',err); alert('Could not save that move — reverted.'); });
}
window.pipeDropReal=pipeDropReal;

}
const OPS_FILTERS=[['all','All'],['att','Needs attention'],['booked','Booked'],['stale','Open >24h'],['unassigned','Unassigned']];
function opsPass(d,f){ switch(f){ case'att':return !!d._att; case'booked':return !!d.meeting; case'stale':return d._comm==='open'&&d._a.h!=null&&d._a.h>24; case'unassigned':return d._comm==='open'&&!d.owner_id; default:return true; } }
function opsFilters(R,cur){ return OPS_FILTERS.map(([k,l])=>{ const n=R.filter(d=>opsPass(d,k)).length; return `<button class="ops-chip ${cur===k?'on':''}" data-of="${k}">${l}<span class="cn">${n}</span></button>`; }).join(''); }

function opsOwnerCell(d){
  if(d._comm==='auto'&&!d.owner) return `<div class="opsown bot"><span class="opsav">⚙</span><span class="on">Automation</span></div>`;
