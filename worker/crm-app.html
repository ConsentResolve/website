  return `<div class="opsown"><span class="opsav" style="background:${d.owner.color}">${esc(d.owner.init)}</span><span class="on">${esc(d.owner.name.split(' ')[0])}</span></div>`;
}
function opsRow(d){
  const c=OPS_COMM[d._comm]||OPS_COMM.open;
  const cls=[d._att?(d._att.lvl==='bad'?'att':'attw'):'', d._comm==='booked'?'booked':'', d._comm==='replying'?'replying':'', d._comm==='auto'?'autor':''].join(' ');
  const pill=`<span class="opspill ${d._comm}"><span class="opspd ${c.live?'live':''}"></span>${c.lbl}</span>`;
  const stLbl=(STAGE_LABELS&&STAGE_LABELS[d.stage])||d.stage||'—';
  const dead=['lost','disqualified'].includes(d.stage);
  const stg=`<div class="opsstg"><div class="sl">${esc(stLbl)}<b>${d.prob!=null?d.prob+'%':''}</b></div><div class="opsmeter"><i style="width:${d.prob||0}%;${dead?'background:var(--tx-3)':''}"></i></div></div>`;
  const val=d.value_usd?`<div class="opsval">${opsMoney(d.value_usd)}</div>`:`<div class="opsval zero">—<em>unsized</em></div>`;
  const fit=d.tier||'none'; const big=opsIntelBig(d);
  const intel=`<div class="opsintel"><span class="opsfit ${fit}">${d.tier||'no intel'}</span>${big?`<span class="big">${big.v}<em> ${big.u}</em></span>`:''}</div>`;
  const stale=d._comm==='open'&&d._a.h!=null&&d._a.h>24;
  const last=`<div class="opslast"><div class="lt">${esc(d.last_label||'—')}</div><div class="ag ${stale?'stale':''}">${d._a.t} ago${d._att?`<span class="opswhy ${d._att.lvl}">${esc(d._att.t)}</span>`:''}</div>${d._kud?`<span class="opskud">★ ${esc(d._kud)}</span>`:''}</div>`;
  const actBtns=[];

  if(d.meeting) actBtns.push(`<button class="opsactbtn mtg" data-mtg="${esc(d.meeting.uid||'')}" data-when="${esc(d.meeting.label)}" data-conv2="${esc(d.conv_id||'')}" title="Meeting details">📅 Meeting</button>`);
  const mtg=actBtns.length?`<div class="opsactcell">${actBtns.join('')}</div>`:`<span class="opsmtg-none">—</span>`;
  const acts=`<div class="opsacts">${(d.owner&&d._att)?`<button class="help" data-act="nudge" data-id="${d.id}">⚑ Nudge</button>`:''}${d._kud?`<button class="kud" data-act="kudos" data-id="${d.id}">★ Kudos</button>`:''}<button data-act="open" data-id="${d.id}">Deal ↗</button></div>`;
  return `<div class="ops-row ${cls}" data-open="${d.id}" data-conv-row="${esc(d.conv_id||'')}" title="Open the record">
    <div class="stp"><i></i></div>
    <div class="opsco"><div class="c1">${d.tier==='hot'?'<span class="opsdot" title="Hot"></span>':''}<span class="nm"${d.company_id?` data-openco="${esc(d.company_id)}" style="cursor:pointer" title="Open company record"`:''}>${esc(d.company||d.name||'—')}</span></div><div class="c2"${d.contact_id?` data-openct="${esc(d.contact_id)}" style="cursor:pointer" title="Open contact record"`:''}>${esc(d.company?(d.name||d.domain||''):(d.domain||''))||'—'}</div></div>

const OPS_SGROUPS=[
  {k:'att',t:'▲ Needs attention',c:'var(--bad)',test:d=>!!d._att},
  {k:'booked',t:'▦ Booked / upcoming',c:'var(--accent-hi)',test:d=>d._comm==='booked'&&!d._att},
  {k:'replying',t:'◉ Actively replying',c:'var(--good)',test:d=>d._comm==='replying'&&!d._att},
  {k:'open',t:'◷ Open — waiting on us',c:'var(--warn)',test:d=>d._comm==='open'&&!d._att},
  {k:'auto',t:'⚙ Auto — sequence running',c:'#7c8cff',test:d=>d._comm==='auto'&&!d._att},
  {k:'later',t:'◍ Later / closed',c:'var(--tx-3)',test:d=>['snoozed','won','closed'].includes(d._comm)&&!d._att}
];
function opsRepGroups(R){
  const seen=new Map();
  R.forEach(d=>{ if(d.owner){ if(!seen.has(d.owner.init)) seen.set(d.owner.init,{t:d.owner.init+' · '+d.owner.name,c:d.owner.color,ids:new Set()}); } });
  const g=[...seen.entries()].map(([k,v])=>({k,t:v.t,c:v.c,test:d=>d.owner&&d.owner.init===k}));
  g.push({k:'un',t:'? · Unassigned',c:'var(--bad)',test:d=>!d.owner&&d._comm!=='auto'});
  g.push({k:'bot',t:'⚙ Automation',c:'#7c8cff',test:d=>d._comm==='auto'&&!d.owner});
  return g;
}
function opsSort(rows,st){ if(!st.sort)return rows; const g={company:d=>(d.company||d.name||'').toLowerCase(),owner:d=>d.owner?d.owner.name:'zz',comm:d=>d._comm,prob:d=>d.prob||0,value:d=>d.value_usd||0,intel:d=>d.est_spend||(d.intel&&d.intel.visits)||d.score||0,age:d=>d._a.h||0}; const f=g[st.sort]; if(!f)return rows; return [...rows].sort((a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*st.dir;}); }

function opsToast(msg){ let t=document.getElementById('ops-toast'); if(!t){ t=document.createElement('div'); t.id='ops-toast'; t.className='ops-toast'; document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),2200); }
function opsMeetingPopover(btn){
  document.querySelectorAll('.ops-pop').forEach(x=>x.remove());
  const uid=btn.getAttribute('data-mtg'), when=btn.getAttribute('data-when'), conv=btn.getAttribute('data-conv2');
  const pop=document.createElement('div'); pop.className='ops-pop';
  pop.innerHTML=`<div class="opspop-h">📅 Demo meeting</div><div class="opspop-when">${esc(when)} · Central</div><div class="opspop-acts">${uid?`<a href="/api/booking/ics?uid=${encodeURIComponent(uid)}" class="opspop-btn">Add to calendar (.ics)</a>`:''}${conv?`<button class="opspop-btn" data-conv="${esc(conv)}">Open conversation</button>`:''}${(!uid&&!conv)?'<div style="font-size:12px;color:var(--tx-3)">No extra details on file.</div>':''}</div>`;
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect();
  const top=Math.min(window.innerHeight-pop.offsetHeight-10, r.bottom+6);
  const left=Math.max(10, Math.min(window.innerWidth-pop.offsetWidth-10, r.left));
  pop.style.top=top+'px'; pop.style.left=left+'px';
  pop.addEventListener('click',ev=>{ const c=ev.target.closest('[data-conv]'); if(c){ pop.remove(); showView('inbox'); if(window.select) select(c.getAttribute('data-conv')); } });
  setTimeout(()=>{ document.addEventListener('click',function h(ev){ if(!pop.contains(ev.target)){ pop.remove(); document.removeEventListener('click',h,true);} }, true); },0);
}

function opsUpdatedLabel(){ if(!window._opsTs)return ''; const s=Math.round((Date.now()-window._opsTs)/1000); if(s<5)return 'Updated just now'; if(s<60)return 'Updated '+s+'s ago'; const m=Math.round(s/60); return 'Updated '+(m<60?m+'m':'>1h')+' ago'; }
/* Re-fetch JUST the pipeline (fast ?only=pipeline endpoint) so the ops console never shows a
   stale page-load snapshot — runs on view-entry and on the manual Refresh button. */
function opsRefresh(){
  const lbl=document.getElementById('ops-updated'); if(lbl)lbl.textContent='refreshing…';
  fetch('/api/crm/app?only=pipeline',{credentials:'same-origin',cache:'no-store'})
    .then(r=>r.json()).then(j=>{ if(j&&Array.isArray(j.PIPELINE)){ window.PIPELINE=j.PIPELINE; window._opsTs=Date.now(); } })
    .catch(()=>{})
    .then(()=>{ const pv=document.getElementById('pipelineview'); if(pv&&!pv.hidden) renderPipeline(); });
}
window.opsRefresh=opsRefresh;
function renderPipelineReal(el,P){
  opsCss();
  const st=window._ops=window._ops||{view:'stage',filter:'all',sort:null,dir:1};
  if(st.showDq===undefined){ try{st.showDq=localStorage.getItem('opsShowDq')==='1';}catch(_){st.showDq=false;} }
  const R=opsDerive(P);
  const dqCount=R.filter(d=>d.stage==='disqualified').length;
  const groups=st.view==='rep'?opsRepGroups(R):OPS_SGROUPS;
  let body='';
  groups.forEach(g=>{
    let rows=R.filter(g.test).filter(d=>opsPass(d,st.filter)).filter(d=>st.showDq||d.stage!=='disqualified');
    rows=opsSort(rows,st);
    if(!rows.length)return;
    const sum=rows.reduce((a,d)=>a+(d.value_usd||0),0);
    body+=`<div class="ops-grp"><div class="ops-gh"><span class="gt" style="color:${g.c||'var(--tx-1)'}">${g.t}</span><span class="gc">${rows.length}</span>${sum?`<span class="gm">${opsMoney(sum)} in play</span>`:''}</div>${rows.map(opsRow).join('')}</div>`;
  });
  if(!body) body=`<div class="ops-empty">Nothing matches that filter.</div>`;
  el.innerHTML=`<div class="opswrap">
    <div class="pipe-head" style="margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">Pipeline — Operations</h2><span id="ops-updated" style="font-size:11.5px;color:var(--tx-3);font-weight:600">${opsUpdatedLabel()}</span><button class="ops-refresh" data-refresh="1" title="Pull the latest deals now">↻ Refresh</button></div>
    <div class="ops-kpis">${opsKpis(R)}</div>
    <div class="ops-ctl">
      <div class="ops-seg"><button data-ov="stage" class="${st.view==='stage'?'on':''}">By status</button><button data-ov="rep" class="${st.view==='rep'?'on':''}">By rep</button></div>
      ${opsFilters(R,st.filter)}
      <label class="ops-dqtoggle" title="Disqualified deals are hidden by default"><input type="checkbox" data-dqtoggle ${st.showDq?'checked':''}> Show disqualified${dqCount?` (${dqCount})`:''}</label>
    </div>
    <div class="ops-tbl"><div class="ops-scroll">
      <div class="ops-h">
        <span></span>
        <span class="sortable" data-os="company">Company · Contact</span>
        <span class="sortable" data-os="owner">Owner</span>
        <span class="sortable" data-os="comm">Comm stage</span>
        <span class="sortable" data-os="prob">Deal stage</span>
        <span class="sortable" data-os="value">Value</span>
        <span class="sortable" data-os="intel">Intel</span>
        <span class="sortable" data-os="age">Last activity</span>
        <span>Activity</span>
      </div>
      <div>${body}</div>
    </div></div>
  </div>`;
  if(!el._opsWired){
    el._opsWired=true;
    el.addEventListener('click',e=>{
      const rf=e.target.closest('[data-refresh]'); if(rf){ e.stopPropagation(); opsRefresh(); return; }
      const dqt=e.target.closest('[data-dqtoggle]'); if(dqt){ window._ops.showDq=!!dqt.checked; try{localStorage.setItem('opsShowDq',dqt.checked?'1':'');}catch(_){} renderPipeline(); return; }
      const ov=e.target.closest('[data-ov]'); if(ov){ window._ops.view=ov.dataset.ov; renderPipeline(); return; }
      const of=e.target.closest('[data-of]'); if(of){ window._ops.filter=of.dataset.of; renderPipeline(); return; }
      const os=e.target.closest('[data-os]'); if(os){ const k=os.dataset.os; window._ops.dir=window._ops.sort===k?-window._ops.dir:1; window._ops.sort=k; renderPipeline(); return; }
      const oco=e.target.closest('[data-openco]'); if(oco){ e.stopPropagation(); if(window.openCompanyRecord) openCompanyRecord(oco.getAttribute('data-openco')); return; }
      const oct=e.target.closest('[data-openct]'); if(oct){ e.stopPropagation(); if(window.openContactRecord) openContactRecord(oct.getAttribute('data-openct')); return; }
      const conv=e.target.closest('[data-conv]'); if(conv){ e.stopPropagation(); const cid=conv.getAttribute('data-conv'); showView('inbox'); if(window.select) select(cid); return; }
      const mtg=e.target.closest('[data-mtg]'); if(mtg){ e.stopPropagation(); opsMeetingPopover(mtg); return; }
      const act=e.target.closest('[data-act]');
      if(act){ e.stopPropagation(); const id=act.dataset.id;
        if(act.dataset.act==='open'){ openDealDetail(id); }
        else if(act.dataset.act==='nudge'){ const d=(window.PIPELINE||[]).find(x=>x.id===id); opsToast('Nudged '+((d&&d.owner&&d.owner.name.split(' ')[0])||'the rep')+' about '+((d&&(d.company||d.name))||'this deal')); }
        else if(act.dataset.act==='kudos'){ const d=(window.PIPELINE||[]).find(x=>x.id===id); opsToast('★ Kudos sent for '+((d&&(d.company||d.name))||'a job well done')); }
        return; }
      // Row click → open the record: the conversation (company + contact + comm thread) when there
      // is one; otherwise the deal detail. The hover "Deal ↗" button always opens the deal detail.
      const row=e.target.closest('[data-open]'); if(row){ const cv=row.getAttribute('data-conv-row'); if(cv){ showView('inbox'); if(window.select) select(cv); } else { openDealDetail(row.dataset.open); } }
    });
  }
}
function renderPipeline(){
  const el=document.getElementById('pipelineview'); if(!el) return;
  if(window.PIPELINE) return renderPipelineReal(el, window.PIPELINE);
  const cols=PSTAGES.map(([k,l])=>{
    const items=DATA.conversations.filter(c=>dstate(c.id).stage===k);
    const sum=items.reduce((a,c)=>a+predictValue(dstate(c.id).visitors),0);
    const cards=items.map(c=>{
      const o=ownerOf(c), d=dstate(c.id);
      return `<div class="pcard" draggable="true" ondragstart="pipeDrag(event,'${c.id}')" onclick="openFromPipeline('${c.id}')">
        <div class="pc-top"><span class="pc-name">${esc(c.name||'Unknown')}</span>${o?`<span class="oav-sm" style="background:${o.color}">${o.init}</span>`:''}</div>
        <div class="pc-co">${esc(c.company||'—')}</div>
        <div class="pc-val">$${predictValue(d.visitors).toLocaleString()}<span> /mo</span></div>
      </div>`;
    }).join('') || `<div class="pcol-empty">Drag deals here</div>`;
    return `<div class="pcol ${k}" ondragover="pipeOver(event)" ondragleave="pipeLeave(event)" ondrop="pipeDrop(event,'${k}')">
      <div class="pcol-h"><span class="pcol-t">${l}</span><span class="pcol-c">${items.length}</span><span class="pcol-sum">$${sum.toLocaleString()}/mo</span></div>
      <div class="pcol-body">${cards}</div>
    </div>`;
  }).join('');
  const open=DATA.conversations.filter(c=>['trial','active'].includes(dstate(c.id).stage));
  const total=open.reduce((a,c)=>a+predictValue(dstate(c.id).visitors),0);
  el.innerHTML = `<div class="pipe-head"><h2>Pipeline</h2><div class="pipe-total">${IC.pipe} Open pipeline <b>$${total.toLocaleString()}</b>/mo · ${open.length} deal${open.length===1?'':'s'}</div></div>
    <div class="pboard">${cols}</div>`;
}

.recd-item{display:flex;align-items:center;gap:11px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .1s}
.recd-item:first-of-type{border-top:0}
.recd-item:hover{background:var(--surface-2)}
.recd-item .ii{flex:1;min-width:0}
.recd-item .it{font-size:var(--t-13);font-weight:700;color:var(--tx-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recd-item .is{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recd-item .iv{font-size:12.5px;font-weight:800;font-family:var(--font-mono);color:var(--tx-1);white-space:nowrap}
.recd-item .ipill{font-size:10px;font-weight:800;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--surface-3);color:var(--tx-2);white-space:nowrap}
.recd-item .ipill.won{background:var(--good-soft);color:var(--good)} .recd-item .ipill.lost,.recd-item .ipill.disqualified{background:var(--bad-soft);color:var(--bad)}
.recd-empty2{padding:16px;text-align:center;color:var(--tx-3);font-size:12px}
.recd-tl{max-height:420px;overflow:auto}
.recd-tlrow{display:flex;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px}
.recd-tlrow:first-child{border-top:0}
.recd-tlrow .tk{flex:0 0 64px;color:var(--tx-3);font-weight:700;font-size:10.5px;text-transform:uppercase;padding-top:1px}
.recd-tlrow .tb{flex:1;min-width:0;color:var(--tx-2);line-height:1.4}
.recd-tlrow .tt{font-size:10.5px;color:var(--tx-3);white-space:nowrap}
.recd-edit{display:flex;flex-direction:column;gap:9px;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-3);padding:16px}
.recd-edit label{font-size:11px;font-weight:800;color:var(--tx-3);text-transform:uppercase;letter-spacing:.03em}
.recd-edit input{height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-2);color:var(--tx-1);font:inherit;font-size:var(--t-14);outline:none}
.recd-edit input:focus{border-color:var(--accent)}
.recd-edit .er{display:flex;gap:8px;margin-top:4px}
.reccomm{padding:12px 16px;display:flex;flex-direction:column;gap:11px}
.reccomm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reccomm-row .rl{width:82px;flex:0 0 auto;font-size:11px;font-weight:800;color:var(--tx-3);text-transform:uppercase;letter-spacing:.03em}
.recnl{font-size:12.5px;font-weight:800;border-radius:5px;padding:3px 9px}
.recnl.good{background:var(--good-soft);color:var(--good)} .recnl.bad{background:var(--bad-soft);color:var(--bad)} .recnl.muted{background:var(--surface-3);color:var(--tx-2)}
.reccons{display:flex;gap:6px;flex-wrap:wrap}
.reccon{font-size:11px;font-weight:800;border-radius:5px;padding:2px 8px}
.reccon.good{background:var(--good-soft);color:var(--good)} .reccon.bad{background:var(--bad-soft);color:var(--bad)} .reccon.muted{background:var(--surface-3);color:var(--tx-3)}
.recdnc{font-size:12px;font-weight:800;color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:6px 10px}
`;
function recCss(){ if(document.getElementById('rec-css'))return; const s=document.createElement('style'); s.id='rec-css'; s.textContent=REC_CSS; document.head.appendChild(s); }
function recMoney(n){ n=Number(n)||0; return '$'+(n>=1000?(n/1000).toFixed(n%1000?1:0)+'k':n); }
function recAgo(iso){ if(!iso)return '—'; const t=Date.parse(iso); if(isNaN(t))return '—'; const m=Math.floor((Date.now()-t)/60000); if(m<1)return 'just now'; if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; const d=Math.floor(h/24); return d+'d ago'; }
function recInits(s){ return (s||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
const REC_STAGE={new:'New',active:'Lead',lead:'Lead',trial:'Trial',won:'Customer',customer:'Customer',lost:'Lost',disqualified:'Disqualified'};

function openContactsBrowse(){ window._rec.contactId=null; window._rec.editing=false; if(window.__crmView!=='contacts')showView('contacts'); else renderContactsView(); }
function openCompaniesBrowse(){ window._rec.companyId=null; window._rec.editing=false; if(window.__crmView!=='companies')showView('companies'); else renderCompaniesView(); }
function openContactRecord(id){ window._rec.contactId=id; window._rec.editing=false; if(window.__crmView!=='contacts')showView('contacts'); else renderContactsView(); try{history.replaceState(null,'','#contact/'+id);}catch(_){} }
function openCompanyRecord(id){ window._rec.companyId=id; window._rec.editing=false; if(window.__crmView!=='companies')showView('companies'); else renderCompaniesView(); try{history.replaceState(null,'','#company/'+id);}catch(_){} }
window.openContactsBrowse=openContactsBrowse; window.openCompaniesBrowse=openCompaniesBrowse; window.openContactRecord=openContactRecord; window.openCompanyRecord=openCompanyRecord;

function renderContactsView(){ const el=document.getElementById('contactsview'); if(!el)return; recCss(); recWire(el); if(window._rec.contactId){ renderContactDetail(el, window._rec.contactId); if(window.__crmView==='contacts')try{history.replaceState(null,'','#contact/'+window._rec.contactId);}catch(_){} } else { renderBrowse(el,'contacts'); } }
function renderCompaniesView(){ const el=document.getElementById('companiesview'); if(!el)return; recCss(); recWire(el); if(window._rec.companyId){ renderCompanyDetail(el, window._rec.companyId); if(window.__crmView==='companies')try{history.replaceState(null,'','#company/'+window._rec.companyId);}catch(_){} } else { renderBrowse(el,'companies'); } }
window.renderContactsView=renderContactsView; window.renderCompaniesView=renderCompaniesView;

function renderBrowse(el,kind){
  const isCo=kind==='companies'; const q=isCo?window._rec.coq:window._rec.cq;
  el.innerHTML=`<div class="recwrap"><div class="rec-head"><h2>${isCo?'Companies':'Contacts'}</h2><input class="rec-search" type="search" placeholder="Search ${isCo?'name or domain':'name, email, phone, company'}…" value="${esc(q)}"></div><div class="rec-list" id="rec-list-${kind}"><div class="rec-loading">Searching…</div></div></div>`;
  const input=el.querySelector('.rec-search');
  if(input){ input.focus(); try{input.setSelectionRange(input.value.length,input.value.length);}catch(_){}
    input.oninput=()=>{ const v=input.value; if(isCo)window._rec.coq=v; else window._rec.cq=v; clearTimeout(window._recTo); window._recTo=setTimeout(()=>recFetchList(kind),220); }; }
  recFetchList(kind);
}
function recFetchList(kind){
  const isCo=kind==='companies'; const q=isCo?window._rec.coq:window._rec.cq;
  const list=document.getElementById('rec-list-'+kind); if(!list)return;
  fetch('/api/crm/'+(isCo?'companies':'contacts')+'?q='+encodeURIComponent(q||'')+'&limit=80',{credentials:'same-origin',cache:'no-store'})
    .then(r=>r.json()).then(j=>{
      if(isCo){ const rows=(j&&j.companies)||[]; list.innerHTML=rows.length?rows.map(recCoRow).join(''):'<div class="rec-empty">No companies match.</div>'; }
      else { const rows=(j&&j.contacts)||[]; list.innerHTML=rows.length?rows.map(recCtRow).join(''):'<div class="rec-empty">No contacts match.</div>'; }
    }).catch(()=>{ list.innerHTML='<div class="rec-empty">Couldn\'t load.</div>'; });
}
function recTierDot(t){ t=(t||'').toLowerCase(); const c=t==='hot'?'var(--bad)':t==='warm'?'var(--warn)':'var(--tx-3)'; return `<span class="rec-tier" style="background:${c}" title="${esc(t||'—')}"></span>`; }
function recCtRow(c){ return `<button class="rec-row" data-contact="${esc(c.id)}"><span class="rec-av">${esc(recInits(c.full_name))}</span><span class="rec-main"><span class="rec-nm">${recTierDot(c.tier)}${esc(c.full_name||'Unknown')}</span><span class="rec-sub">${esc(c.primary_email||c.phone||'—')}${c.company?' · '+esc(c.company):''}</span></span><span class="rec-meta">${c.stage_label?`<span class="rec-chip">${esc(c.stage_label)}</span>`:''}${c.deals?`<span class="rec-chip">${c.deals} deal${c.deals>1?'s':''}</span>`:''}<span class="rec-ago">${recAgo(c.last_activity)}</span></span></button>`; }
function recCoRow(c){ return `<button class="rec-row" data-company="${esc(c.id)}"><span class="rec-av co">${esc((c.name||'?').slice(0,2).toUpperCase())}</span><span class="rec-main"><span class="rec-nm">${esc(c.name||'—')}</span><span class="rec-sub">${esc(c.domain||'no domain')} · ${c.contacts||0} contact${c.contacts==1?'':'s'} · ${c.deals||0} deal${c.deals==1?'':'s'}</span></span><span class="rec-meta">${c.open_value_usd?`<span class="rec-chip">${recMoney(c.open_value_usd)}</span>`:''}<span class="rec-ago">${recAgo(c.last_activity)}</span></span></button>`; }

function recDealItem(d){ const st=(d.lead_status||'').toLowerCase(); const lbl=REC_STAGE[st]||st||'—'; return `<div class="recd-item" data-deal="${esc(d.id)}"><span class="ipill ${st}">${esc(lbl)}</span><span class="ii"><span class="it">${esc(d.title||d.contact_name||'Deal')}</span><span class="is">${d.close_probability!=null?d.close_probability+'% · ':''}${d.owner_name?'Owner: '+esc(d.owner_name):''}</span></span><span class="iv">${d.value_cents?recMoney(Math.round(d.value_cents/100)):'—'}</span></div>`; }
function recConvItem(c){ return `<div class="recd-item" data-conv="${esc(c.id)}"><span class="ii"><span class="it">${esc(c.contact_name||c.subject||c.channel||'Conversation')}${c.unread?' <span style="color:var(--accent-hi)">●</span>':''}</span><span class="is">${esc((c.channel||'')+' · '+(c.last_message_preview||c.subject||''))}</span></span><span class="rec-ago">${recAgo(c.last_message_at)}</span></div>`; }
function recTlRow(e){ const k=e.kind==='message'?(e.direction==='in'?'← in':'→ out'):e.kind; const body=e.kind==='message'?esc((e.text||'').slice(0,140)):e.kind==='note'?('Note: '+esc((e.text||'').slice(0,120))):e.kind==='activity'?esc(e.action||''):e.kind==='pageview'?('Viewed '+esc(e.path||'')):esc(JSON.stringify(e)); return `<div class="recd-tlrow"><span class="tk">${esc(k)}</span><span class="tb">${body}</span><span class="tt">${recAgo(e.at)}</span></div>`; }
const REC_NL={opted_in:['Subscribed','good'],active:['Subscribed','good'],pending:['Pending','muted'],suppressed:['Unsubscribed','bad'],unsubscribed:['Unsubscribed','bad'],optout:['Unsubscribed','bad']};
function recNlBadge(status){ const s=(status||'pending').toLowerCase(); return REC_NL[s]||[s.replace(/_/g,' '),'muted']; }
function recConChip(label,val){ const v=(val||'none').toLowerCase(); const cls=v==='granted'?'good':(v==='revoked'||v==='denied'||v==='optout')?'bad':'muted'; const sym=v==='granted'?'✓':(v==='revoked'||v==='denied'||v==='optout')?'✕':'—'; return `<span class="reccon ${cls}" title="${esc(v)}">${label} ${sym}</span>`; }
function recCommsCard(cm, contactId){ cm=cm||{}; const nb=recNlBadge(cm.newsletter_status); const step=(String(cm.newsletter_status||'').toLowerCase()==='pending'&&cm.repermission_step)?` · re-permission ${cm.repermission_step}/4`:''; const con=cm.consent||{};
  const optedOut=cm.suppressed&&(cm.suppressions||[]).some(s=>/declin|unsub|optout|opt-out|complain|spam/i.test(s.reason||''));
  const isOptedIn=String(cm.newsletter_status||'').toLowerCase()==='opted_in';
  const supp=cm.suppressed?`<div class="reccomm-row"><span class="rl">Do-not-contact</span><span class="recdnc">⛔ Suppressed${(cm.suppressions&&cm.suppressions.length)?' · '+esc(cm.suppressions.map(s=>s.channel||s.reason||'').filter(Boolean).join(', ')):''}</span></div>`:'';
  const optinBtn=(!isOptedIn&&!optedOut&&contactId)?`<div class="reccomm-row"><span class="rl"></span><button class="recd-btn primary" data-optin="${esc(contactId)}" title="Mark this contact as consented (admin attestation)">✓ Mark opted-in</button></div>`:'';
  return `<div class="recd-card"><h4>Communication status</h4><div class="reccomm">
    <div class="reccomm-row"><span class="rl">Newsletter</span><span class="recnl ${nb[1]}">${esc(nb[0])}</span>${step?`<span style="font-size:11.5px;color:var(--tx-3);font-weight:600">${esc(step.replace(/^ · /,''))}</span>`:''}</div>
    <div class="reccomm-row"><span class="rl">Consent</span><span class="reccons">${recConChip('Email',con.email)}${recConChip('SMS',con.sms)}${recConChip('Voice',con.voice)}</span></div>
    ${supp}${optinBtn}
  </div></div>`; }

function renderContactDetail(el,id){
  el.innerHTML=`<div class="recd"><button class="recd-back" data-back="contacts">← All contacts</button><div class="rec-loading">Loading record…</div></div>`;
  fetch('/api/crm/contact?id='+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(!d||d.error){ el.querySelector('.rec-loading').textContent='Record not found.'; return; }
    const ct=d.contact||{}, co=d.company||null, st=d.stats||{};
    const tier=(ct.tier||'').toLowerCase();
    if(window._rec.editing){ el.querySelector('.recd').innerHTML=`<button class="recd-back" data-back="contacts">← All contacts</button>`+recContactEditForm(ct,co); return; }
    const nb=recNlBadge((d.comms&&d.comms.newsletter_status)||ct.newsletter_status);
    const badges=[tier?`<span class="recd-badge ${tier}">${esc(tier)}</span>`:'', ct.stage_label?`<span class="recd-badge" title="Stage">${esc(ct.stage_label)}</span>`:'', ct.lead_score!=null?`<span class="recd-badge">Score ${ct.lead_score}</span>`:'', `<span class="recd-badge ${nb[1]==='good'?'':nb[1]==='bad'?'':''}" title="Newsletter status">✉ ${esc(nb[0])}</span>`].filter(Boolean).join('');
    const line=[ct.primary_email?`<a href="mailto:${esc(ct.primary_email)}">${esc(ct.primary_email)}</a>`:'', ct.phone?esc(ct.phone):'', co?`<a data-company="${esc(co.id)}">🏢 ${esc(co.name||'company')}</a>`:''].filter(Boolean).join('<span style="color:var(--tx-4)">·</span> ');
    el.querySelector('.recd').innerHTML=`
      <button class="recd-back" data-back="contacts">← All contacts</button>
      <div class="recd-hero"><span class="recd-av">${esc(recInits(ct.full_name))}</span>
        <div class="recd-id"><div class="recd-nm">${esc(ct.full_name||'Unknown')}</div>${badges?`<div class="recd-badges">${badges}</div>`:''}<div class="recd-contactline">${line||'—'}</div></div>
        <div class="recd-heroacts"><button class="recd-btn" data-editc>Edit</button>${co?`<button class="recd-btn" data-company="${esc(co.id)}">Company →</button>`:''}</div>
      </div>
      <div class="recd-stats">
        <div class="recd-stat"><div class="sv">${st.conversations||0}</div><div class="sl">Conversations</div></div>
        <div class="recd-stat"><div class="sv">${st.deals||0}</div><div class="sl">Deals</div></div>
        <div class="recd-stat"><div class="sv">${st.messages||0}</div><div class="sl">Messages</div></div>
        <div class="recd-stat"><div class="sv">${st.speed_to_lead_hours!=null?st.speed_to_lead_hours+'h':'—'}</div><div class="sl">Speed to lead</div></div>
      </div>
      <div class="recd-cols">
        <div style="display:flex;flex-direction:column;gap:16px">
          ${recCommsCard(d.comms, ct.id)}
          <div class="recd-card"><h4>Deals <span class="n">${(d.deals||[]).length}</span></h4>${(d.deals||[]).length?(d.deals||[]).map(recDealItem).join(''):'<div class="recd-empty2">No deals yet.</div>'}</div>
          <div class="recd-card"><h4>Communications <span class="n">${(d.conversations||[]).length}</span></h4>${(d.conversations||[]).length?(d.conversations||[]).map(recConvItem).join(''):'<div class="recd-empty2">No conversations.</div>'}</div>
        </div>
        <div class="recd-card"><h4>Activity timeline</h4><div class="recd-tl">${(d.timeline||[]).length?(d.timeline||[]).slice(0,60).map(recTlRow).join(''):'<div class="recd-empty2">No activity.</div>'}</div></div>
      </div>`;
  }).catch(()=>{ const l=el.querySelector('.rec-loading'); if(l)l.textContent='Couldn\'t load record.'; });
}
function recContactEditForm(ct,co){ return `<div class="recd-edit"><div class="recd-nm" style="font-size:var(--t-16);margin-bottom:4px">Edit contact</div>
  <label>Full name</label><input id="rec-e-name" value="${esc(ct.full_name||'')}">
  <label>Phone</label><input id="rec-e-phone" value="${esc(ct.phone||'')}">
  <label>Company</label><input id="rec-e-company" value="${esc(co?co.name:'')}" placeholder="Company name">
  <div class="er"><button class="recd-btn primary" data-savec="${esc(ct.id)}">Save</button><button class="recd-btn" data-canceledit>Cancel</button></div></div>`; }

function renderCompanyDetail(el,id){
  el.innerHTML=`<div class="recd"><button class="recd-back" data-back="companies">← All companies</button><div class="rec-loading">Loading record…</div></div>`;
  fetch('/api/crm/company?id='+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(d=>{
    if(!d||d.error){ el.querySelector('.rec-loading').textContent='Record not found.'; return; }
    const co=d.company||{}, st=d.stats||{}, intel=d.intel||{};
    if(window._rec.editing){ el.querySelector('.recd').innerHTML=`<button class="recd-back" data-back="companies">← All companies</button>`+recCompanyEditForm(co); return; }
    const chips=[intel.traffic_month?`<span class="recd-badge">📈 ${Number(intel.traffic_month).toLocaleString()} visits/mo</span>`:'', (intel.ad_spend_month||intel.est_ad_spend)?`<span class="recd-badge">💸 ${recMoney(intel.ad_spend_month||intel.est_ad_spend)}/mo ad spend</span>`:'', intel.industry?`<span class="recd-badge">${esc(intel.industry)}</span>`:'', intel.employees?`<span class="recd-badge">👥 ${intel.employees}</span>`:''].filter(Boolean).join('');
    el.querySelector('.recd').innerHTML=`
      <button class="recd-back" data-back="companies">← All companies</button>
      <div class="recd-hero"><span class="recd-av co">${esc((co.name||'?').slice(0,2).toUpperCase())}</span>
        <div class="recd-id"><div class="recd-nm">${esc(co.name||'Company')}</div>${chips?`<div class="recd-badges">${chips}</div>`:''}<div class="recd-contactline">${co.domain?`<a href="https://${esc(co.domain)}" target="_blank" rel="noopener">${esc(co.domain)}</a>`:'no domain on file'}</div></div>
        <div class="recd-heroacts"><button class="recd-btn" data-editco>Edit</button><button class="recd-btn" data-rmco="${esc(co.id)}" title="Remove this company and detach its contacts (they keep their records, just no company)">Not a real company</button></div>
      </div>
      <div class="recd-stats">
        <div class="recd-stat"><div class="sv">${recMoney(st.open_value_usd||0)}</div><div class="sl">Open pipeline</div></div>
        <div class="recd-stat"><div class="sv">${recMoney(st.weighted_value_usd||0)}</div><div class="sl">Weighted</div></div>
        <div class="recd-stat"><div class="sv">${recMoney(st.won_value_usd||0)}</div><div class="sl">Won</div></div>
        <div class="recd-stat"><div class="sv">${st.contacts||0}</div><div class="sl">Contacts</div></div>
        <div class="recd-stat"><div class="sv">${st.deals||0}</div><div class="sl">Deals</div></div>
      </div>
      <div class="recd-cols">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="recd-card"><h4>Contacts <span class="n">${(d.contacts||[]).length}</span></h4>${(d.contacts||[]).length?(d.contacts||[]).map(c=>`<div class="recd-item" data-contact="${esc(c.id)}">${recTierDot(c.tier)}<span class="ii"><span class="it">${esc(c.full_name||'Unknown')}</span><span class="is">${esc(c.title||c.primary_email||'')}</span></span><span class="rec-ago">${esc(c.stage_label||'')}</span></div>`).join(''):'<div class="recd-empty2">No contacts.</div>'}</div>
          <div class="recd-card"><h4>Deals <span class="n">${(d.deals||[]).length}</span></h4>${(d.deals||[]).length?(d.deals||[]).map(recDealItem).join(''):'<div class="recd-empty2">No deals.</div>'}</div>
          <div class="recd-card"><h4>Communications <span class="n">${(d.conversations||[]).length}</span></h4>${(d.conversations||[]).length?(d.conversations||[]).map(recConvItem).join(''):'<div class="recd-empty2">No conversations.</div>'}</div>
        </div>
        <div class="recd-card"><h4>Activity timeline</h4><div class="recd-tl">${(d.timeline||[]).length?(d.timeline||[]).slice(0,60).map(recTlRow).join(''):'<div class="recd-empty2">No activity.</div>'}</div></div>
      </div>`;
  }).catch(()=>{ const l=el.querySelector('.rec-loading'); if(l)l.textContent='Couldn\'t load record.'; });
}
function recCompanyEditForm(co){ return `<div class="recd-edit"><div class="recd-nm" style="font-size:var(--t-16);margin-bottom:4px">Edit company</div>
  <label>Name</label><input id="rec-e-coname" value="${esc(co.name||'')}">
  <label>Domain</label><input id="rec-e-codomain" value="${esc(co.domain||'')}" placeholder="example.com">
  <div class="er"><button class="recd-btn primary" data-saveco="${esc(co.id)}">Save</button><button class="recd-btn" data-canceledit>Cancel</button></div></div>`; }

function recSaveContact(id){
  const v=s=>{const e=document.getElementById(s);return e?e.value.trim():undefined;};
  const body={id, full_name:v('rec-e-name'), phone:v('rec-e-phone'), company_name:v('rec-e-company')};
  fetch('/api/crm/contact',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(()=>{ window._rec.editing=false; if(window.crmToast)crmToast('Contact saved'); renderContactsView(); })

function recWire(el){
  if(el._recWired)return; el._recWired=true;
  el.addEventListener('click',e=>{
    const back=e.target.closest('[data-back]'); if(back){ if(back.dataset.back==='contacts')openContactsBrowse(); else openCompaniesBrowse(); return; }
    const editc=e.target.closest('[data-editc]'); if(editc){ window._rec.editing=true; renderContactsView(); return; }
    const editco=e.target.closest('[data-editco]'); if(editco){ window._rec.editing=true; renderCompaniesView(); return; }
    const rmco=e.target.closest('[data-rmco]'); if(rmco){ e.stopPropagation(); const cid=rmco.getAttribute('data-rmco');
      if(!confirm('Remove this company? Its contacts and conversations stay — they’re just detached (no company). This can’t be undone.')) return;
      rmco.textContent='Removing…'; rmco.disabled=true;
      fetch('/api/crm/cleanup-companies',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cid,execute:true})}).then(r=>r.json()).then(j=>{
        if(j&&j.deleted){ if(window.crmToast)crmToast('Company removed · '+(j.detached_contacts||0)+' contact(s) detached'); window._rec.companyId=null; openCompaniesBrowse(); }
        else { if(window.crmToast)crmToast('Could not remove — '+((j&&j.error)||'error')); rmco.textContent='Not a real company'; rmco.disabled=false; }
      }).catch(()=>{ if(window.crmToast)crmToast('Could not remove (network)'); rmco.textContent='Not a real company'; rmco.disabled=false; }); return; }
    const cancel=e.target.closest('[data-canceledit]'); if(cancel){ window._rec.editing=false; if(window._rec.contactId)renderContactsView(); else renderCompaniesView(); return; }
    const optin=e.target.closest('[data-optin]'); if(optin){ e.stopPropagation(); const cid=optin.getAttribute('data-optin'); optin.textContent='Saving…'; fetch('/api/newsletter',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'opt_in_contact',contact_id:cid})}).then(r=>r.json()).then(()=>{ if(window.crmToast)crmToast('Marked opted-in'); renderContactsView(); }).catch(()=>{ if(window.crmToast)crmToast('Could not save'); }); return; }
    const savec=e.target.closest('[data-savec]'); if(savec){ recSaveContact(savec.getAttribute('data-savec')); return; }
    const saveco=e.target.closest('[data-saveco]'); if(saveco){ recSaveCompany(saveco.getAttribute('data-saveco')); return; }
    const co=e.target.closest('[data-company]'); if(co){ e.preventDefault(); openCompanyRecord(co.getAttribute('data-company')); return; }
    const ct=e.target.closest('[data-contact]'); if(ct){ openContactRecord(ct.getAttribute('data-contact')); return; }
    const deal=e.target.closest('[data-deal]'); if(deal){ if(window.openDealDetail)openDealDetail(deal.getAttribute('data-deal')); return; }
    const conv=e.target.closest('[data-conv]'); if(conv){ showView('inbox'); if(window.select)select(conv.getAttribute('data-conv')); return; }
  });
}

/* ================= Single-Task Mode (Phase 1) =================
   Per-user focus mode: show the ONE most important lead to reply to, one at a time.
   Ranking is client-side over DATA.conversations so the pick always opens; the server
   endpoint owns the per-user enabled flag + first-view claim/log. "Done" = a reply, a
   reminder, or a disqualify on the focused lead -> auto-advance to the next. */
window._stEnabled=false; window._stMe=null; window._focusMode=false; window._focusDone=null;
async function stCheck(){
  try{ const d=await fetch('/api/crm/single-task',{credentials:'same-origin'}).then(r=>r.json());
    window._stEnabled=!!(d&&d.enabled); window._stMe=(d&&d.user)||null;
  }catch(_){ window._stEnabled=false; }
  const b=document.getElementById('focusBtn'); if(b) b.hidden=true; // forced when enabled — no manual entry
  applyForced();
  return window._stEnabled;
}
// Enabled == FORCED. Hide the inbox list immediately and drop into the focus queue as soon
// as real data is loaded; disabling (only from Settings) restores the normal inbox.
function applyForced(){
  window._forced=window._stEnabled;
  if(window._forced){ document.body.classList.add('focus-on'); enterForcedFocus(0); }
  else{ window._focusMode=false; document.body.classList.remove('focus-on');
        const h=document.getElementById('focushud'); if(h)h.remove();
        const z=document.getElementById('focusZero'); if(z)z.remove(); }
}
function dataReady(){ return window.CRM_LIVE_PENDING===false || (DATA&&DATA.conversations&&DATA.conversations.some(c=>!String(c.id).startsWith('c0'))); }
function enterForcedFocus(tries){
  tries=tries||0; if(!window._forced || window._focusMode) return;
  const iv=document.getElementById('inboxview');
  if(!iv || iv.hidden) return;                       // re-enter when they return to the inbox
  if(!dataReady() && tries<20){ setTimeout(()=>enterForcedFocus(tries+1),400); return; }
  focusStart();
}
// Rank: my leads first, then hottest, then longest-waiting. Only OPEN + UNREAD (waiting on us).
function focusCandidates(){
  const meId=window._stMe&&window._stMe.id, done=window._focusDone||new Set();
  const mine=c=>meId&&c.assignee&&c.assignee.id===meId;
  return (DATA.conversations||[])
    .filter(c=>c.bucket==='open' && c.unread && !done.has(c.id) && !String(c.id).startsWith('c0'))
    .sort((a,b)=> (mine(b)?1:0)-(mine(a)?1:0) || (b.hot?1:0)-(a.hot?1:0) || convTs(a)-convTs(b));
}
function focusPick(){ return focusCandidates()[0]||null; }
function focusHud(remaining){
  let h=document.getElementById('focushud');
  if(!h){ h=document.createElement('div'); h.id='focushud'; document.body.appendChild(h); }
  h.innerHTML=`<span class="fh-prog">◎ ${remaining} waiting</span><span class="fh-sep">·</span>`
    +`<button onclick="focusRemind()" title="Set a reminder / callback">⏰ Remind</button>`
    +`<button class="fh-dq" onclick="focusDq()" title="Disqualify this lead">⛔ Disqualify</button>`
    +`<button onclick="focusSkip()" title="Skip for now">Skip →</button>`;
}
function focusServe(c){
  const z=document.getElementById('focusZero'); if(z)z.remove();
  select(c.id);
  focusHud(focusCandidates().length);
  try{ if(typeof openReply==='function') setTimeout(openReply,60); }catch(_){}
  // Claim + stamp first-view (best-effort).
  fetch('/api/crm/single-task',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({viewed:{id:c.id}})}).catch(()=>{});
}
function focusZero(){
  window._focusMode=false;                          // no active lead, but STAY in focus-on (list stays hidden)
  const h=document.getElementById('focushud'); if(h)h.remove();
  let z=document.getElementById('focusZero'); if(!z){ z=document.createElement('div'); z.id='focusZero'; document.body.appendChild(z); }
  z.innerHTML=`<div class="fz-card"><div class="fz-emoji">✅</div><h3>Inbox zero</h3><p>No leads waiting on a reply right now. Nice work.</p><button onclick="focusRecheck()">Check for new leads</button></div>`;
}
function focusRecheck(){ const z=document.getElementById('focusZero'); if(z)z.remove(); window._focusDone=new Set(); focusStart(); }
function focusStart(){
  window._focusMode=true; if(!window._focusDone)window._focusDone=new Set(); document.body.classList.add('focus-on');
  const p=focusPick(); if(!p){ focusZero(); return; }
  focusServe(p);
}
// Called after a lead is handled (reply / reminder / disqualify) — advance to the next.
function focusAdvance(){
  if(!window._focusMode) return;
  if(sel) (window._focusDone||(window._focusDone=new Set())).add(sel);
  setTimeout(()=>{ if(!window._focusMode) return; const n=focusPick(); if(n) focusServe(n); else focusZero(); }, 450);
}
function focusSkip(){ if(!window._focusMode) return; if(sel)(window._focusDone||(window._focusDone=new Set())).add(sel); const n=focusPick(); if(n) focusServe(n); else focusZero(); }
function focusRemind(){ if(sel) openRemind(sel); }
function focusDq(){ if(sel) dealTabDisqualify(sel); }
function focusExit(silent){
  window._focusMode=false; document.body.classList.remove('focus-on');

/* On-demand intel lookup — gathers from the live website (+ Apollo/Claude if keyed), shows cost. */
async function runLookup(id, mode, ev, force){
  if(ev) ev.stopPropagation();
  mode = mode || 'all';
  const e=(window.ENRICH||{})[id]||{};
  let site=(e.website&&e.website.domain)||'';
  if(!site){ site=(prompt('Website to look up (e.g. acmehvac.com):','')||'').trim(); if(!site) return; }
  const label = mode==='dataforseo'?'DataForSEO':mode==='all'?'Enriching':'Claude lookup';
  const note=document.getElementById('ilook-note-'+id); if(note) note.textContent=label+': looking up '+site+'…';
  if(window.crmToast) crmToast(label+': '+site+'…');
  const conv=DATA.conversations.find(x=>x.id===id);
  const contactId=conv?conv.contact_id:null;   // the endpoint keys off the CONTACT, not the conversation
  const r=await fetch('/api/crm/lookup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact_id:contactId, website:site, mode:mode, force:!!force})}).then(x=>x.json()).catch(()=>null);
  if(!r||!r.ok){ const msg=(r&&(r.message||r.error))||'lookup failed'; if(note) note.textContent=msg; if(window.crmToast) crmToast('Lookup failed: '+msg); return; }
  window.ENRICH=window.ENRICH||{}; window.DIRECTORY=window.DIRECTORY||{}; window.INTEL=window.INTEL||{};
  window.ENRICH[id]=Object.assign({}, window.ENRICH[id]||{}, r.enrich||{}, {_last_cost:r.cost_usd, _signals:r.signals});
  window.DIRECTORY[id]=Object.assign({}, window.DIRECTORY[id]||{}, r.directory||{});
  window.INTEL[id]=Object.assign({}, window.INTEL[id]||{}, r.intel||{});
  // #1 writeback — reflect the record changes the server just made, so the Address
  // section + card update immediately (no refresh needed).
  const wb=r.writeback||[];
  const sig=r.signals||{};
  if(wb.includes('phone') && (sig.phone||(r.directory&&r.directory.phone))){ window.PHONES=window.PHONES||{}; window.PHONES[id]=sig.phone||r.directory.phone; }
  const cv0=DATA.conversations.find(x=>x.id===id);
  if(cv0){ if(wb.includes('company') && sig.company_name) cv0.company=sig.company_name; if(wb.includes('name') && sig.owner) cv0.name=sig.owner; if(wb.includes('email') && sig.emails&&sig.emails[0]) cv0.contact_email=cv0.contact_email||sig.emails[0]; }
  const c=DATA.conversations.find(x=>x.id===id); if(c && curTab==='intel') renderTab(c);
  if(window.renderList) renderList(curFilter());   // refresh the list row (name/company may have changed)
  const paid=(r.breakdown||[]).filter(x=>x.cost>0);
  const costStr = r.cost_usd>0 ? '$'+(+r.cost_usd).toFixed(4) : 'free';
  const misses=(r.breakdown||[]).filter(x=>x.ok===false && x.note).map(x=>x.note);
  const wbMsg = wb.length ? ' · updated '+wb.join(', ') : '';
  if(window.crmToast) crmToast('Looked up '+r.domain+' · '+costStr+wbMsg+(misses.length?' — note: '+misses[0]:''));
}

/* Open sequence/automation tasks (crm_tasks entity) for this conversation — the SDR worklist. */
async function loadSeqTasks(c){
  const host=document.getElementById('seqtasks'); if(!host||!c) return;

  try{ const q=c.contact_id?('contact_id='+encodeURIComponent(c.contact_id)):('conversation_id='+encodeURIComponent(c.id)); const r=await fetch('/api/crm/task?status=open&'+q,{credentials:'same-origin'}); const d=await r.json(); tasks=(d&&d.tasks)||[]; }catch(_){}
  if(!tasks.length){ host.innerHTML=''; return; }
  const ic={call:'📞',linkedin:'🔗',manual:'✅',followup:'⏰',email_nudge:'✉️'};
  host.innerHTML='<div class="seqtasks-hd">To-do <span class="seqtasks-n">'+tasks.length+'</span></div>'+tasks.map(function(t){
    return '<div class="seqtask" data-id="'+t.id+'"><span class="seqtask-ic">'+(ic[t.type]||'✅')+'</span><div class="seqtask-main"><div class="seqtask-t">'+esc(t.title||'Task')+'</div>'+(t.body?'<div class="seqtask-b">'+esc(t.body)+'</div>':'')+(t.due_at?'<div class="seqtask-due">due '+esc(String(t.due_at).slice(0,10))+'</div>':'')+'</div><div class="seqtask-acts"><button class="seqtask-done" onclick="tskComplete(\''+t.id+'\',\'done\')">Done</button><button class="seqtask-skip" onclick="tskComplete(\''+t.id+'\',\'skipped\')">Skip</button></div></div>';
  }).join('');
}
async function tskComplete(id,status){
  const el=document.querySelector('.seqtask[data-id="'+id+'"]'); if(el) el.style.opacity=.5;
  try{ await fetch('/api/crm/task',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'complete',id,status})}); }catch(_){}
  if(el) el.remove();
  const host=document.getElementById('seqtasks'); if(host&&!host.querySelector('.seqtask')) host.innerHTML='';
  if(window.crmToast) crmToast(status==='done'?'Task done':'Task skipped');
}

/* Near-real-time live chat: while a website-chat conversation is open, poll Retell's
   transcript every ~3s and re-render the thread. (Retell has no per-message push, and it
   can't expose pre-send typing — this is as live as it gets.) */
let _chatPoll=null, _watching=null, _watchCount=-1;
function stopChatPoll(){ if(_chatPoll){ clearInterval(_chatPoll); _chatPoll=null; } _watching=null; _watchCount=-1; }
function parseTranscript(t, visitorLabel){
  const out=[]; const vlab=visitorLabel||"Website Visitor";
  (t||"").split("\n").forEach(function(line){
    const m=line.match(/^(Website Visitor|Them|User|Mack|Agent|Assistant):\s*(.*)$/i);
    if(m){ const isMack=/mack|agent|assistant/i.test(m[1]); out.push({ dir:isMack?"out":"in", channel:"chat", who:isMack?"Mack":vlab, body:m[2], ts:"" }); }
    else if(out.length && line.trim()){ out[out.length-1].body += "\n"+line; }
  });
  return out;
}
// Watch toggle: polling only runs when a rep clicks "Watch" — no one watching, no polling.
// The full transcript still lands in the background via the 1-min cron sweep.
function toggleWatch(id){
  const btn=document.getElementById('watchBtn');
  if(_watching===id){ stopChatPoll(); if(btn){ btn.classList.remove('on'); btn.innerHTML='🟢 Watch live'; } return; }
  const c=DATA.conversations.find(x=>x.id===id); if(!c||!c.chat_id) return;
  stopChatPoll(); _watching=id; _watchCount=(c.messages||[]).length;
  if(btn){ btn.classList.add('on'); btn.innerHTML='⏸ Watching…'; }
  const poll=function(){
    fetch('/api/crm/chat-live?chat_id='+encodeURIComponent(c.chat_id),{credentials:'same-origin'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(_watching!==id || sel!==id){ stopChatPoll(); return; }
        if(!d || !d.ok) return;
        const cc=DATA.conversations.find(x=>x.id===id); if(!cc) return;
        const vlab=d.name||d.email||"Website Visitor";
        const msgs=parseTranscript(d.transcript, vlab);
        // Only touch the DOM when a new message actually arrived → no flicker/scroll jump.
        if(msgs.length && msgs.length!==_watchCount){
          _watchCount=msgs.length; cc.messages=msgs;
          if(curTab==='reply'){
            const host=document.querySelector('#tabbody .msgs');
            if(host){ host.outerHTML=bubbleThread(cc); const nm=document.querySelector('#tabbody .msgs'); if(nm) nm.scrollTop=nm.scrollHeight; }
            else renderTab(cc);
          }
        }
        // Identity dropped in the chat (email/phone) → update the open conversation live.
        if(d.email && cc.contact_email!==d.email){
          cc.contact_email=d.email;
          if(d.name) cc.name=d.name; else if(!cc.name||cc.name==='Unknown'||/^[(+]/.test(cc.name)) cc.name=d.email;
          const h=document.querySelector('#thread .who h2'); if(h) h.textContent=cc.name;
          renderList(curFilter());
        }
        if(d.ended){ cc.live=false; stopChatPoll(); const b=document.getElementById('watchBtn'); if(b){ b.classList.remove('on'); b.innerHTML='● Chat ended'; b.disabled=true; } }
      }).catch(function(){});
  };
  poll(); _chatPoll=setInterval(poll, 3000);
}
window.toggleWatch=toggleWatch;
function select(id){

  if(c && c.unread){

  }
  renderList(document.querySelector(".filters .on").dataset.f);
  const useGmail = c.channel==="email";
  const phone = PHONES[c.id] || c.contact_phone;
  const emailCm = c.contact_email

  const costTxt = c.intel.cost_per_lead ? ` ($${c.intel.cost_per_lead.toFixed(2)})` : '';
  document.getElementById("thread").innerHTML = `
    <div class="thead">

        <div class="who"><h2>${esc(c.name||"Unknown contact")}</h2><div class="sub">${esc(c.company||"no company")}</div>
          <div class="cmeta">
            <span class="cm"><span class="chip src-${c.source}"><span class="dot"></span>${SRC[c.source]}${costTxt}</span></span>
            <span class="sep">·</span>${emailCm}
            <span class="sep">·</span>${phoneCm}
          </div>
        </div>
        <div class="hdr-right">${(c.chat_id && c.live)?`<button class="watchbtn" id="watchBtn" onclick="toggleWatch('${c.id}')">🟢 Watch live</button>`:''}<button class="watchbtn" onclick="copyRecordLink()" title="Copy a shareable link to this record">🔗 Share</button>${autoControl(c)}</div>
      </div>
      <div class="stagebar ${stageMeta.c}"><span class="sb-ic">${stageMeta.ic}</span><span class="sb-lab">Stage</span><span class="sb-val">${stageMeta.l}</span></div>
      <div class="tabs">
        <button class="tab ${curTab==='reply'?'on':''}" data-tab="reply" onclick="switchTab('reply')"><span class="ti">${IC.reply}</span>Reply</button>
        <button class="tab ${curTab==='activity'?'on':''}" data-tab="activity" onclick="switchTab('activity')"><span class="ti">${IC.activity}</span>Activity</button>
        <button class="tab ${curTab==='intel'?'on':''}" data-tab="intel" onclick="switchTab('intel')"><span class="ti">${IC.intel}</span>Intel</button>
        <button class="tab ${curTab==='task'?'on':''}" data-tab="task" onclick="switchTab('task')"><span class="ti">${IC.task}</span>Task</button>
        <button class="tab ${curTab==='deal'?'on':''}" data-tab="deal" onclick="switchTab('deal')"><span class="ti">${IC.deal}</span>Stage</button>
      </div>
    </div>
    <div class="tabbody" id="tabbody"></div>
  `;
  renderTab(c);
}
window.select = select;

// Restore the inbox to where you left off (filter + open lead + scroll) after a refresh.

function restoreInbox(){

<script>
(function(){
  var Q=[
    {k:"why",q:"Why did you start Consent Resolve — the real reason, in your words?"},
    {k:"first_sign",q:"An early customer or moment that stuck with you."},
    {k:"angry",q:"What about the shared-lead / reseller world actually makes you angry?"},
    {k:"phrases",q:"Three phrases you catch yourself saying all the time."},
    {k:"customer",q:"Describe your favorite kind of contractor customer."},
    {k:"belief",q:"A belief about marketing most people in this space would disagree with."},
    {k:"feel",q:"What do you want a contractor to FEEL reading your newsletter?"},
    {k:"flywheel",q:"A story where the flywheel (signs → leads → more signs) clicked for someone."}
  ];
  var answers={}, idx=0, built=false;
  function firstBlank(){for(var i=0;i<Q.length;i++){if(!(answers[Q[i].k]&&String(answers[Q[i].k]).trim()))return i;}return Q.length;}
  function log(){return document.getElementById('fvLog');}
  function addMsg(who,text){var d=document.createElement('div');d.className='fvmsg '+who;d.textContent=text;log().appendChild(d);log().scrollTop=log().scrollHeight;}
  function prog(){var d=document.createElement('div');d.className='fvprog';d.textContent='Question '+Math.min(idx+1,Q.length)+' of '+Q.length;log().appendChild(d);}
  function ask(){ if(idx>=Q.length){ addMsg('bot',"That's everything — thank you, Andy. This shapes every issue. You can reopen this anytime to change an answer."); return; } prog(); addMsg('bot',Q[idx].q); }
  function save(){ return fetch('/founder-voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:answers})}).catch(function(){}); }
  function send(){ var t=document.getElementById('fvIn'); var v=(t.value||'').trim(); if(!v)return; addMsg('me',v); answers[Q[idx].k]=v; t.value=''; idx++; save(); setTimeout(ask,340); }
  function build(){
    if(built)return; built=true;
    var pill=document.createElement('button'); pill.id='fvPill';
    pill.innerHTML='<span class="fvdot"></span>Andy — 15 min to nail your voice?<span class="fvno" title="Not now">×</span>';
    var panel=document.createElement('div'); panel.id='fvPanel';
    panel.innerHTML='<div class="fvhd"><div><b>Founder Voice</b><small>Andy Mentges · shapes the newsletter</small></div><button class="fvx" title="Later">×</button></div><div id="fvLog"></div><div id="fvFoot"><textarea id="fvIn" rows="1" placeholder="Type however you actually talk…"></textarea><button id="fvSend">Send</button></div>';
    document.body.appendChild(pill); document.body.appendChild(panel);
    pill.addEventListener('click',function(e){ if(e.target.classList.contains('fvno')){ e.stopPropagation(); try{sessionStorage.setItem('fvDismiss','1');}catch(_){}; pill.style.display='none'; return; } openPanel(); });
    panel.querySelector('.fvx').onclick=function(){ panel.style.display='none'; pill.style.display='flex'; };
    panel.querySelector('#fvSend').onclick=send;
    panel.querySelector('#fvIn').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  }
  function openPanel(){
    build();
    document.getElementById('fvPill').style.display='none';
    var p=document.getElementById('fvPanel'); p.style.display='flex';
    if(!log().childNodes.length){ idx=firstBlank(); addMsg('bot',"Hey Andy — I'm writing the field-kit newsletter in your voice, so I want the real you, not my impression of it. Eight quick questions; it saves as we go."); setTimeout(ask,420); }
    var t=document.getElementById('fvIn'); if(t) t.focus();
  }
  window.fvOpen=function(){
    if(!window._fvIsAndy){ if(window.crmToast) crmToast("The Founder Voice intake is Andy's — it appears when he's signed in."); return; }
    openPanel();
  };
  // Auto-offer the pill on login when the intake isn't finished — ANDY ONLY (not the rest of the team).
  fetch('/founder-voice?json=1',{headers:{'Accept':'application/json'}}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d||!d.ok) return;                              // not authed / error → no bubble
    answers=d.answers||{}; window._fvIsAndy=!!d.is_andy;
    if(!window._fvIsAndy) return;                      // only Andy sees the bubble
    if(firstBlank()>=Q.length) return;                 // already fully answered
    try{ if(sessionStorage.getItem('fvDismiss')) return; }catch(_){}
    build(); document.getElementById('fvPill').style.display='flex';
  }).catch(function(){});
})();
</script>
