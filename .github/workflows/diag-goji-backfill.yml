name: diag-goji-backfill
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pull all Gojiberry-sourced prospects needing backfill
        run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, domain, promoted_contact_id FROM prospects WHERE run_id='pr_run_gojiberry_inbound'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
