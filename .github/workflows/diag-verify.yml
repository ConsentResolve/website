name: diag-verify
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT promoted_contact_id, signals FROM prospects WHERE promoted_contact_id IN (SELECT promoted_contact_id FROM prospects WHERE signals LIKE '%gojiberry%' LIMIT 1) AND promoted_contact_id IS NOT NULL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
