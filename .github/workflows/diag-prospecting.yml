name: diag-prospecting
on: workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Query prospecting state
        run: |
          echo "=== recent runs (last 10) ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, stage, cost_cents, max_cost_cents, note, created_at FROM prospect_runs ORDER BY created_at DESC LIMIT 10" --json
          echo "=== running/paused runs ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, counts, note, created_at FROM prospect_runs WHERE status IN ('running','paused') ORDER BY created_at DESC" --json
          echo "=== prospect counts by tier ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT tier, count(*) as n FROM prospects GROUP BY tier" --json
          echo "=== prospect counts by disposition ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT disposition, count(*) as n FROM prospects GROUP BY disposition" --json
          echo "=== instantly staged vs pushed ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT json_extract(disposition_meta,'\$.staged') as staged, json_extract(disposition_meta,'\$.instantly_pushed') as pushed, count(*) as n FROM prospects WHERE disposition='instantly' GROUP BY staged, pushed" --json
          echo "=== stuck/unscored count ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT status, count(*) as n FROM prospects GROUP BY status" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
