name: diag-tyler-token
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Update all 4 users' CRM identity to the new domain
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='aaron@getconsentresolve.com' WHERE email='aaron@consentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='andy@getconsentresolve.com' WHERE email='andy@consentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='tyler@getconsentresolve.com' WHERE email='tyler@consentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='jason@getconsentresolve.com' WHERE email='jason@consentresolve.com'"
          echo "=== verify ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, name, role FROM users" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
