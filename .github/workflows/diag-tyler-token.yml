name: diag-tyler-token
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Tyler's user record vs connected gmail token
        run: |
          echo "=== users table ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, name, role, active FROM users WHERE email LIKE '%tyler%'" --json
          echo "=== social_tokens (gmail) ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT provider, updated_at, refresh_token IS NOT NULL as has_refresh, access_token IS NOT NULL as has_access, expires_at FROM social_tokens WHERE provider LIKE '%tyler%'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
