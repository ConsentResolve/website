name: diag-tyler-token
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check all 4 users vs their connected gmail tokens
        run: |
          echo "=== all users ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, name, role, active FROM users" --json
          echo "=== all connected gmail tokens ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT provider FROM social_tokens WHERE provider LIKE 'gmail:%'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
