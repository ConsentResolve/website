name: deploy

# Builds the Astro site and deploys the Worker (worker/index.js + ./dist assets)
# to Cloudflare. Runs on every push to main, or on demand for any branch via
# the "Run workflow" button (useful for shipping an integration branch before
# it merges).
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   token from the Cloudflare account that owns the
#                          consentresolve-website Worker ("Edit Cloudflare
#                          Workers" template + Account · D1 · Edit)
#   CLOUDFLARE_ACCOUNT_ID  that account's ID (dashboard right sidebar)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
