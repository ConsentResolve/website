name: diag-goji-run-backfill
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run the 138-prospect Gojiberry backfill
        run: npx wrangler d1 execute consentresolve-demo --remote --file=scripts/_tmp_goji_backfill.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
      - name: Spot-check a few results
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT full_name FROM contacts WHERE id IN ('ct_z0peyb1emt0x80gg','ct_bb0y6gblmt0lidr4')" --json
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) n FROM notes WHERE id LIKE 'bf_pr_%'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
