name: diag-jason-beck
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Find Jason Beck's contact + conversation + notes
        run: |
          echo "=== contact ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, full_name, phone, company_id FROM contacts WHERE full_name LIKE '%Jason Beck%'" --json
          echo "=== company ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT c.id, co.name, co.domain FROM contacts c LEFT JOIN companies co ON co.id=c.company_id WHERE c.full_name LIKE '%Jason Beck%'" --json
          echo "=== conversation ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, subject, assignee_id, last_message_preview FROM conversations WHERE contact_id IN (SELECT id FROM contacts WHERE full_name LIKE '%Jason Beck%')" --json
          echo "=== notes ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT body, created_at FROM notes WHERE contact_id IN (SELECT id FROM contacts WHERE full_name LIKE '%Jason Beck%') ORDER BY created_at" --json
          echo "=== prospect signals ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT domain, name, city, region, trade, signals FROM prospects WHERE promoted_contact_id IN (SELECT id FROM contacts WHERE full_name LIKE '%Jason Beck%')" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
