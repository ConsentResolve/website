name: diag-send-fails
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT conversation_id, body_text, sent_at FROM messages WHERE channel='system' AND body_text LIKE '%failed to send%' ORDER BY sent_at DESC LIMIT 15"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
