name: diag-goji-activity
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run activity + extra-field backfill
        run: npx wrangler d1 execute consentresolve-demo --remote --file=scripts/_tmp_goji_activity.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
      - name: Verify
        run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) n FROM notes WHERE id LIKE 'act_pr_%'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
