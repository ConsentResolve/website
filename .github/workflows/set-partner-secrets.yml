name: Set partner secrets

# Pushes the Jobber + provisioning secrets into the Cloudflare Worker without
# anyone needing a terminal (Actions tab -> "Run workflow"). Reuses the same
# CLOUDFLARE_API_TOKEN that deploy.yml already uses.
#
# The VALUES live as GitHub repo secrets, never as workflow inputs -- inputs are
# recorded in the run's metadata and shown in the UI, which is exactly the wrong
# place for a client secret. Add them under
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   JOBBER_CLIENT_ID           Jobber Developer Center -> your app -> Authorization
#   JOBBER_CLIENT_SECRET       same panel (regenerate first if it has been exposed)
#   DASHBOARD_PROVISION_URL    https://api.consentresolve.com/api/v1/provision/partner
#   DASHBOARD_PROVISION_SECRET `openssl rand -hex 32` -- must be byte-identical to
#                              the value set on the crmono api worker
#
# Any secret you leave unset is skipped, so it is safe to run this repeatedly as
# you fill them in one at a time.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Put secrets on consentresolve-website
        env:
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
          DASHBOARD_PROVISION_URL: ${{ secrets.DASHBOARD_PROVISION_URL }}
          DASHBOARD_PROVISION_SECRET: ${{ secrets.DASHBOARD_PROVISION_SECRET }}
        run: |
          set -euo pipefail
          put() {
            name="$1"
            value="${2-}"
            if [ -z "$value" ]; then
              echo "- $name: not set as a repo secret, skipping"
              return 0
            fi
            # printf '%s', never echo: a trailing newline rides into the stored
            # value and produces "mismatch" errors that look like a wrong
            # credential. This bit us before with TWILIO_FROM_NUMBER -- see the
            # note in wrangler.jsonc.
            printf '%s' "$value" | npx wrangler secret put "$name"
            echo "ok $name"
          }
          put JOBBER_CLIENT_ID           "$JOBBER_CLIENT_ID"
          put JOBBER_CLIENT_SECRET       "$JOBBER_CLIENT_SECRET"
          put DASHBOARD_PROVISION_URL    "$DASHBOARD_PROVISION_URL"
          put DASHBOARD_PROVISION_SECRET "$DASHBOARD_PROVISION_SECRET"

      - name: List what the worker now holds (names only, never values)
        run: npx wrangler secret list
