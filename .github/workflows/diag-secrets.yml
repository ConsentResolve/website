name: diag-secrets
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: List configured Worker secrets (names only)
        run: npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
      - name: Check AI credits flag + recent DataForSEO-touched prospect timestamps
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT * FROM ai_credits_status WHERE id=1" --json
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, domain, stages_run, updated_at FROM prospects WHERE run_id='pr_run_aastfloemt0a13tf' AND status='new' ORDER BY updated_at DESC LIMIT 5" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
