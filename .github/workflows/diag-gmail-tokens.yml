name: diag-gmail-tokens
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT provider, (refresh_token IS NOT NULL) has_refresh, expires_at, updated_at FROM social_tokens WHERE provider LIKE 'gmail:%'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
