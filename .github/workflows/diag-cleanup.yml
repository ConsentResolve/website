name: diag-cleanup
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Remove stray test row + verify queue order
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "DELETE FROM social_queue WHERE resource_slug='test-key-check'"
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, resource_slug, platform, status FROM social_queue WHERE platform='linkedin_company' ORDER BY id ASC" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
