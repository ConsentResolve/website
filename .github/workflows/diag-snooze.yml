name: Diagnose Snooze
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Query snoozed conversations
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, snooze_until, unread, updated_at, datetime('now') as now_dt, julianday(snooze_until) as jd_snooze, julianday('now') as jd_now, (julianday(snooze_until) <= julianday('now')) as should_be_due FROM conversations WHERE status='snoozed' ORDER BY snooze_until ASC LIMIT 20"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
