name: Diagnose Snooze
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: sample upcoming rows per platform
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT platform, resource_slug, resource_type, status, scheduled_at, payload FROM social_queue WHERE platform IN ('linkedin_company','linkedin_personal','google_business_profile','x') AND status IN ('scheduled') ORDER BY scheduled_at ASC LIMIT 15"
