name: Diagnose Snooze
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Overdue snoozed conversations right now
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, snooze_until, unread, updated_at, datetime('now') as now_dt, (julianday(snooze_until) <= julianday('now')) as should_be_due FROM conversations WHERE status='snoozed' AND snooze_until IS NOT NULL AND julianday(snooze_until)<=julianday('now') ORDER BY snooze_until ASC LIMIT 20"
      - name: All currently snoozed (for context)
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, snooze_until, updated_at FROM conversations WHERE status='snoozed' ORDER BY snooze_until ASC LIMIT 30"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
