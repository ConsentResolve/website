name: Diagnose Snooze
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Recently resurfaced conversations
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, snooze_until, unread, updated_at FROM conversations WHERE status='open' AND updated_at >= datetime('now','-3 hours') ORDER BY updated_at DESC LIMIT 20"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
