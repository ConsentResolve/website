name: Diagnose Snooze
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Before - open conversations with stale snooze_until
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, snooze_until, snooze_note, updated_at FROM conversations WHERE status='open' AND snooze_until IS NOT NULL"
      - name: One-time backfill - clear stale snooze fields on already-open conversations
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE conversations SET snooze_until=NULL, snooze_note=NULL WHERE status='open' AND snooze_until IS NOT NULL"
      - name: After - confirm none remain
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) as remaining FROM conversations WHERE status='open' AND snooze_until IS NOT NULL"
