name: diag-gmail-check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check gmail status endpoint
        run: |
          curl -s "https://consentresolve.com/api/crm/gmail/status?key=${{ secrets.FEEDBACK_KEY }}"
      - name: Check secret existence (names only)
        run: npx wrangler secret list | grep -E "CRM_INBOX_EMAILS|CRM_ALLOWED_EMAILS|CRM_ALLOWED_DOMAIN|GMAIL_CLIENT" || echo "none of those names found"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
      - name: Check social_tokens table for connected gmail accounts
        run: npx wrangler d1 execute consentresolve-demo --remote --command "SELECT provider, updated_at FROM social_tokens WHERE provider LIKE 'gmail:%'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
