name: diag-bounce
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check bounce state for sarah.scholl@frisbyconstruction.com
        run: |
          echo "=== conversation(s) for this contact ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, status, channel, subject, unread, last_message_preview, updated_at FROM conversations WHERE contact_id='ct_abb3msnpmsp5bwtn'" --json
          echo "=== suppressions table ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT * FROM suppressions WHERE email='sarah.scholl@frisbyconstruction.com'" --json
          echo "=== legacy crm_suppressions ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT * FROM crm_suppressions WHERE email='sarah.scholl@frisbyconstruction.com'" --json
          echo "=== contact identifier lookup ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT contact_id FROM contact_identifiers WHERE type='email' AND value='sarah.scholl@frisbyconstruction.com'" --json
          echo "=== contact + company ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT c.id, c.full_name, c.company_id, co.name as company_name FROM contacts c LEFT JOIN companies co ON co.id=c.company_id WHERE c.id IN (SELECT contact_id FROM contact_identifiers WHERE type='email' AND value='sarah.scholl@frisbyconstruction.com')" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
