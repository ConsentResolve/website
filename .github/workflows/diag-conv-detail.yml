name: diag-conv-detail
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT cv.id, cv.channel, cv.external_thread_id, cv.channel_account_id, cv.assignee_id, u.name, u.email, u.send_as_email FROM conversations cv LEFT JOIN users u ON u.id=cv.assignee_id WHERE cv.id='01M0SCM1TTAB4SHG18WB9TATD0'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
