name: diag-goji-test
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify the test lead landed correctly
        run: |
          echo "=== prospect row ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, domain, name, tier, status, disposition, disposition_by FROM prospects WHERE domain='test-gojiberry-integration.com'" --json
          echo "=== conversation ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, channel, status, subject, assignee_id FROM conversations WHERE contact_id='ct_y8ypxevxmt0fmkf6'" --json
          echo "=== note ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT body FROM notes WHERE conversation_id='cv_ekjmsxismt0fmkg8'" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
