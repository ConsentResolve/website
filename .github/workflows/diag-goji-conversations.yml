name: diag-goji-conversations
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect full current state (duplicates expected)
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, send_as_email, name, role, created_at FROM users ORDER BY name, created_at" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
