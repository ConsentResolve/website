name: diag-goji-conversations
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect Gojiberry-sourced conversations + raw payload log
        run: |
          echo "=== count of open conversations sourced via Gojiberry run ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) n FROM conversations WHERE source_detail='bounce' OR contact_id IN (SELECT promoted_contact_id FROM prospects WHERE run_id='pr_run_gojiberry_inbound')" --json
          echo "=== a sample of 5 gojiberry-sourced prospects (raw signals) ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, domain, name, city, region, trade, signals FROM prospects WHERE run_id='pr_run_gojiberry_inbound' LIMIT 5" --json
          echo "=== total gojiberry-sourced prospects ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) n, status FROM prospects WHERE run_id='pr_run_gojiberry_inbound' GROUP BY status" --json
          echo "=== raw payload log sample (3) ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT payload FROM gojiberry_webhook_log ORDER BY id DESC LIMIT 3" --json
          echo "=== raw payload log count ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT COUNT(*) n FROM gojiberry_webhook_log" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
