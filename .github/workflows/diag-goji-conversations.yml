name: diag-goji-conversations
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Revert login email, set send_as_email correctly
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "ALTER TABLE users ADD COLUMN send_as_email TEXT" || echo "column likely already exists, continuing"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='aaron@consentresolve.com', send_as_email='aaron@getconsentresolve.com' WHERE email='aaron@getconsentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='andy@consentresolve.com', send_as_email='andy@getconsentresolve.com' WHERE email='andy@getconsentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='tyler@consentresolve.com', send_as_email='tyler@getconsentresolve.com' WHERE email='tyler@getconsentresolve.com'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='jason@consentresolve.com', send_as_email='jason@getconsentresolve.com' WHERE email='jason@getconsentresolve.com'"
          echo "=== verify ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, send_as_email, name FROM users" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
