name: diag-goji-conversations
on:
  workflow_dispatch: {}
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Delete the 4 fresh duplicate rows (zero history) + fix the 4 real rows
        run: |
          npx wrangler d1 execute consentresolve-demo --remote --command "DELETE FROM users WHERE id IN ('01M0G9NT5551RHD5V95BVDXT81','01M0G9NTCS64AS2WYF1GWZH3F4','01M0G9NTWJA40CC440HR5XZ2TW','01M0G9NTMEJR0W70ZYESDT5Z3Y')"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='aaron@consentresolve.com', send_as_email='aaron@getconsentresolve.com' WHERE id='01KW2WQNYK5SA9GYAQWVJH8N4G'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='andy@consentresolve.com', send_as_email='andy@getconsentresolve.com' WHERE id='01KW2WQP0JFRW17QPDAE7YW39B'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='jason@consentresolve.com', send_as_email='jason@getconsentresolve.com' WHERE id='01KW2WQP44Q9SJTBSWPW90RXR1'"
          npx wrangler d1 execute consentresolve-demo --remote --command "UPDATE users SET email='tyler@consentresolve.com', send_as_email='tyler@getconsentresolve.com' WHERE id='01KW2WQP2D8Z8HV9EVPHVNA9JY'"
          echo "=== verify — should be exactly 4 rows now ==="
          npx wrangler d1 execute consentresolve-demo --remote --command "SELECT id, email, send_as_email, name, role FROM users" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7caa0c227ac2d290437ecf6932b2806d
