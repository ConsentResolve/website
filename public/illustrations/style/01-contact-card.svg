  <rect x="60" y="108" width="80" height="6" rx="3" fill="#5FB98C" stroke="#14271C" stroke-width="3"/>
  <rect x="68" y="122" width="64" height="5" rx="2.5" fill="#BCE3CB" stroke="#14271C" stroke-width="3"/>
  <!-- phone handset shadow -->
  <path d="M65 152 q-2 -10 10 -10 l8 6 q3 4 0 8 l-4 4 q12 14 28 16 l4 -4 q4 -3 8 0 l6 8 q0 12 -10 10 q-30 -2 -50 -38 z" fill="#1B3A2A" transform="translate(4,4)"/>
  <!-- phone handset -->
  <path d="M65 152 q-2 -10 10 -10 l8 6 q3 4 0 8 l-4 4 q12 14 28 16 l4 -4 q4 -3 8 0 l6 8 q0 12 -10 10 q-30 -2 -50 -38 z" fill="#5FB98C" stroke="#14271C" stroke-width="5" stroke-linejoin="round"/>
