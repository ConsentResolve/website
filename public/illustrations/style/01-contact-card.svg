  <circle cx="103" cy="78" r="20" fill="#1B3A2A"/>
  <!-- avatar -->
  <circle cx="100" cy="75" r="20" fill="#5FB98C" stroke="#14271C" stroke-width="5"/>
  <!-- avatar shine -->
  <path d="M88 67 q4 -6 12 -6" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
