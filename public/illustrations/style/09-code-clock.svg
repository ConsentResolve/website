<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- code panel shadow -->
  <rect x="22" y="62" width="100" height="84" rx="10" fill="#1B3A2A"/>
  <!-- code panel -->
  <rect x="18" y="58" width="100" height="84" rx="10" fill="#BCE3CB" stroke="#14271C" stroke-width="5"/>
  <!-- left bracket -->
  <path d="M50 80 l-12 20 l12 20" stroke="#14271C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- right bracket -->
  <path d="M86 80 l12 20 l-12 20" stroke="#14271C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- slash -->
  <line x1="74" y1="78" x2="62" y2="122" stroke="#14271C" stroke-width="6" stroke-linecap="round"/>
  <!-- clock shadow -->
  <circle cx="146" cy="134" r="32" fill="#1B3A2A"/>
  <!-- clock face -->
  <circle cx="142" cy="130" r="32" fill="#5FB98C" stroke="#14271C" stroke-width="5"/>
  <!-- clock 12 mark -->
  <line x1="142" y1="104" x2="142" y2="110" stroke="#14271C" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="150" x2="142" y2="156" stroke="#14271C" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="130" x2="122" y2="130" stroke="#14271C" stroke-width="4" stroke-linecap="round"/>
  <line x1="162" y1="130" x2="168" y2="130" stroke="#14271C" stroke-width="4" stroke-linecap="round"/>
  <!-- hands -->
  <line x1="142" y1="130" x2="142" y2="112" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <line x1="142" y1="130" x2="156" y2="130" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="142" cy="130" r="3" fill="#14271C"/>
  <!-- shine -->
  <path d="M122 116 q6 -8 14 -10" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
