<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- motion lines -->
  <line x1="30" y1="80" x2="55" y2="80" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <line x1="22" y1="100" x2="50" y2="100" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="120" x2="55" y2="120" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <!-- phone shadow -->
  <rect x="74" y="44" width="80" height="132" rx="16" fill="#1B3A2A"/>
  <!-- phone -->
  <rect x="70" y="40" width="80" height="132" rx="16" fill="#5FB98C" stroke="#14271C" stroke-width="5"/>
  <!-- screen -->
  <rect x="78" y="56" width="64" height="92" rx="6" fill="#BCE3CB" stroke="#14271C" stroke-width="4"/>
  <!-- home indicator -->
  <rect x="92" y="158" width="36" height="5" rx="2.5" fill="#14271C"/>
  <!-- notification arrow up on screen -->
  <path d="M110 130 l0 -38 m-10 12 l10 -14 l10 14" stroke="#14271C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- shine -->
  <path d="M82 64 q4 -4 10 -4" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
