<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- lead card shadow -->
  <rect x="22" y="78" width="56" height="56" rx="6" fill="#1B3A2A"/>
  <!-- lead card -->
  <rect x="18" y="74" width="56" height="56" rx="6" fill="#BCE3CB" stroke="#14271C" stroke-width="5"/>
  <circle cx="46" cy="92" r="8" fill="#5FB98C" stroke="#14271C" stroke-width="4"/>
  <rect x="30" y="106" width="32" height="4" rx="2" fill="#14271C"/>
  <rect x="34" y="116" width="24" height="3" rx="1.5" fill="#14271C"/>
  <!-- connecting line with break -->
  <line x1="80" y1="102" x2="92" y2="102" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <line x1="116" y1="102" x2="128" y2="102" stroke="#14271C" stroke-width="5" stroke-linecap="round"/>
  <!-- padlock shadow -->
  <rect x="96" y="92" width="22" height="22" rx="3" fill="#1B3A2A"/>
  <!-- padlock body -->
  <rect x="93" y="89" width="22" height="22" rx="3" fill="#5FB98C" stroke="#14271C" stroke-width="4"/>
  <!-- shackle -->
  <path d="M97 89 v-6 q0 -8 7 -8 q7 0 7 8 v6" stroke="#14271C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- house shadow -->
  <path d="M124 132 v-32 l24 -22 l24 22 v32 q0 6 -6 6 h-36 q-6 0 -6 -6 z" fill="#1B3A2A"/>
  <!-- house -->
  <path d="M120 128 v-32 l24 -22 l24 22 v32 q0 6 -6 6 h-36 q-6 0 -6 -6 z" fill="#5FB98C" stroke="#14271C" stroke-width="5" stroke-linejoin="round"/>
  <!-- door -->
  <rect x="136" y="106" width="16" height="28" rx="2" fill="#BCE3CB" stroke="#14271C" stroke-width="4"/>
  <!-- window -->
  <rect x="124" y="92" width="10" height="10" fill="#BCE3CB" stroke="#14271C" stroke-width="3"/>
</svg>
