<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- bell shadow -->
  <path d="M104 44 q22 0 30 22 q4 16 4 28 q0 14 8 24 h-84 q8 -10 8 -24 q0 -12 4 -28 q8 -22 30 -22 z" fill="#1B3A2A"/>
  <!-- bell -->
  <path d="M100 40 q22 0 30 22 q4 16 4 28 q0 14 8 24 h-84 q8 -10 8 -24 q0 -12 4 -28 q8 -22 30 -22 z" fill="#5FB98C" stroke="#14271C" stroke-width="5" stroke-linejoin="round"/>
  <!-- top knob -->
  <circle cx="100" cy="36" r="6" fill="#5FB98C" stroke="#14271C" stroke-width="4"/>
  <!-- clapper -->
  <path d="M88 122 q12 12 24 0" stroke="#14271C" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="138" r="6" fill="#BCE3CB" stroke="#14271C" stroke-width="4"/>
  <!-- shine -->
  <path d="M80 70 q6 -14 18 -16" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- return arrow loop (top-right of bell) -->
  <path d="M156 70 q12 -2 16 12 q4 16 -10 22 q-12 4 -22 -10 m-6 8 l2 -10 l10 4" stroke="#14271C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
