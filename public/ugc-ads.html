<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Consent Resolve — UGC ad review</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1628;color:#f5f8fa;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:30px 24px 10px;text-align:center}
h1{margin:0;font-size:24px}
header p{color:#94a3b8;margin:8px auto 0;font-size:14px;max-width:640px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,280px));justify-content:center;gap:22px;max-width:1300px;margin:26px auto;padding:0 22px}
.card{background:#0e1d33;border:1px solid #1e293b;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vidwrap{position:relative;background:#000;aspect-ratio:9/16}
.vidwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.meta{padding:12px 14px 14px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#00e5a0;background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.25);border-radius:999px;padding:3px 9px;margin-right:6px}
.tag.p{color:#7cc4ff;background:rgba(124,196,255,.1);border-color:rgba(124,196,255,.25)}
.tag.s{color:#fbbf24;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
footer{text-align:center;color:#64748b;font-size:12px;padding:12px 0 40px}
</style></head><body>
<header>
<h1>UGC Ad Review — Consent Resolve</h1>
<p>The hype ad set — short FB cuts first, then the full versions. Compliance-cleared: illustrative spokesperson framing, no fabricated testimonials.</p>
</header>
<div class="grid" id="grid"></div>
<footer>Consent Resolve &middot; internal review &middot; noindex</footer>
<script>
// All videos in one group; short FB cuts first. Media on R2 (never committed, per .gitignore).
var R2="https://pub-27fc71b9070247178d8756a59bef0b33.r2.dev/social/ugc-ads/";
var VER="7";
var VIDEOS=[
  {slug:"hype-visited-short",   label:"Who Visited (Male)", kind:"FB short · 9:16", short:true},
  {slug:"hype-goldmine-short",  label:"Goldmine (Female)",  kind:"FB short · 9:16", short:true},
  {slug:"hype-anon-male",       label:"Anonymous (Male)",   kind:"Full · 9:16"},
  {slug:"hype-visited-male",    label:"Who Visited (Male)", kind:"Full · 9:16"},
  {slug:"hype-goldmine-female", label:"Goldmine (Female)",  kind:"Full · 9:16"}
];
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
var grid=document.getElementById("grid");
VIDEOS.forEach(function(v){
  var card=document.createElement("div");card.className="card";
  card.innerHTML=
    '<div class="vidwrap"><video src="'+R2+v.slug+'.mp4?v='+VER+'" controls playsinline preload="metadata"></video></div>'+
    '<div class="meta"><span class="tag'+(v.short?" s":"")+'">'+esc(v.label)+'</span><span class="tag p">'+esc(v.kind)+'</span></div>';
  grid.appendChild(card);
});
</script>
</body></html>
